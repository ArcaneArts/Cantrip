name: cantrip-app
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: cantrip.art
    type: PRIMARY
  - domain: app.cantrip.art
    type: ALIAS

features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - component:
        name: site
      match:
        authority:
          exact: cantrip.art
        path:
          prefix: /
    - component:
        name: app
      match:
        authority:
          exact: app.cantrip.art
        path:
          prefix: /
    - match:
        authority:
          exact: ${STARTER_DOMAIN}
        path:
          prefix: /
      redirect:
        authority: cantrip.art

static_sites:
  - name: app
    environment_slug: node-js
    build_command: node build.mjs app
    github:
      branch: release
      deploy_on_push: true
      repo: ArcaneArts/Cantrip
    source_dir: /.do/web-build
    output_dir: dist
    index_document: index.html
    catchall_document: index.html
  - name: site
    environment_slug: node-js
    build_command: node build.mjs site
    github:
      branch: release
      deploy_on_push: true
      repo: ArcaneArts/Cantrip
    source_dir: /.do/web-build
    output_dir: dist
    index_document: index.html
    catchall_document: index.html

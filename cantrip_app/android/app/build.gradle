apply plugin: 'com.android.application'

def cantripVersionProperties = new Properties()
def cantripVersionFile = rootProject.file('cantrip-version.properties')
if (cantripVersionFile.exists()) {
    cantripVersionFile.withInputStream { cantripVersionProperties.load(it) }
}
def cantripVersionName = cantripVersionProperties.getProperty('CANTRIP_VERSION_NAME', '1.1.0')
def cantripVersionCode = cantripVersionProperties.getProperty('CANTRIP_VERSION_CODE', '1').toInteger()
def cantripAndroidSigning = [
    storeFile: System.getenv('CANTRIP_ANDROID_UPLOAD_KEYSTORE_PATH'),
    storePassword: System.getenv('CANTRIP_ANDROID_UPLOAD_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('CANTRIP_ANDROID_UPLOAD_KEY_ALIAS'),
    keyPassword: System.getenv('CANTRIP_ANDROID_UPLOAD_KEY_PASSWORD'),
]
def cantripAndroidSigningRequested = cantripAndroidSigning.values().any { it }
if (cantripAndroidSigningRequested && cantripAndroidSigning.values().any { !it }) {
    throw new GradleException('Android release signing requires the keystore path, store password, key alias, and key password.')
}

android {
    namespace = "art.cantrip"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (cantripAndroidSigningRequested) {
            release {
                storeFile file(cantripAndroidSigning.storeFile)
                storePassword cantripAndroidSigning.storePassword
                keyAlias cantripAndroidSigning.keyAlias
                keyPassword cantripAndroidSigning.keyPassword
            }
        }
    }
    defaultConfig {
        applicationId "art.cantrip"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode cantripVersionCode
        versionName cantripVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (cantripAndroidSigningRequested) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    sourceSets {
        test.resources.srcDir rootProject.file('../../scripts/fixtures/installation-update')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.16.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

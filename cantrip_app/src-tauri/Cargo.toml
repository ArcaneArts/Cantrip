[package]
name = "cantrip-app"
version = "0.0.0"
description = "Cantrip desktop client"
authors = ["Cantrip"]
edition = "2021"

[lib]
name = "cantrip_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = { version = "3", features = ["termination"] }
ed25519-dalek = "2"
futures-util = "0.3"
hpke = { version = "0.14", default-features = false, features = ["aes", "alloc", "getrandom", "hkdfsha2", "nistp"] }
keyring = "4.2"
libc = "0.2"
flate2 = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10"
tar = "0.4"
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_WebDav",
  "Win32_NetworkManagement_WNet",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSCell",
  "NSControl",
  "NSImage",
  "NSResponder",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSData",
  "NSGeometry",
] }
window-vibrancy = "0.6"

[package]
name = "cantrip-worker"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "cantrip-worker"

[features]
guest-run-definitions = []
guest-files = []

[[bin]]
name = "cantrip-os-run-definitions"
path = "src/bin/os-run-definitions.rs"
required-features = ["guest-run-definitions"]

[[bin]]
name = "cantrip-os-files"
path = "src/bin/os-files.rs"
required-features = ["guest-files"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
brotli = "=9.1.1"
dom_smoothie = { version = "=0.18.2", default-features = false }
cantrip-browser = { path = "../crates/cantrip-browser" }
cantrip-interaction = { path = "../cantrip_interaction", features = ["sprites"] }
encoding_rs = { version = "=0.8.35", default-features = false, features = ["alloc"] }
cantrip-crypto = { path = "../crates/cantrip-crypto" }
cantrip-framing = { path = "../crates/cantrip-framing" }
cantrip-transport = { path = "../crates/cantrip-transport" }
zeroize = "1"
cantrip-config = { path = "../crates/cantrip-config" }
cantrip-history = { path = "../crates/cantrip-history" }
cantrip-host = { path = "../crates/cantrip-host" }
cantrip-wire = { path = "../crates/cantrip-wire" }
cantrip-logging = { path = "../crates/cantrip-logging" }
cantrip-protocol = { path = "../crates/cantrip-protocol" }
chrono = "0.4"
flate2 = "1"
tar = "=0.4.46"
zip = { version = "=9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
unicode-normalization = "0.1"
futures = "0.3"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
indexmap = "2.14"
idna = "=1.1.0"
percent-encoding = "=2.3.2"
icu_collator = { version = "=2.1.1", path = "../cantrip_server_rs/third-party/icu_collator" }
icu_locale_core = "2.4"
regex = "1"
regress = { version = "0.12", features = ["utf16"] }
sha2 = "0.11"
subtle = "2"
getrandom = { version = "0.3", features = ["std"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["native-tls", "gzip", "deflate", "brotli"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "native-tls"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
icu_casemap = "=2.1.1"
icu_normalizer = "=2.1.1"
codex-utils-pty = { version = "0.166.0", path = "../cantrip_codex/upstream/codex-rs/utils/pty" }
tempfile = "3"
toml = "1.2"
notify = "=8.2.0"
vt100 = "=0.16.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
dav-server = { version = "=0.12.0", default-features = false, features = ["proppatch"] }
ed25519-dalek = "=2.2.0"
md-5 = "=0.11.0"
cap-std = "=4.0.3"
async-trait = "0.1"
rtc = "=0.21.1"
rtc-shared = "=0.21.1"
webrtc = { version = "=0.21.1", path = "third-party/webrtc" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
junction = { version = "=2.1.0", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3.0.11"

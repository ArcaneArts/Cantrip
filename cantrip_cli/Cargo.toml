[package]
name = "cantrip-cli"
version = "0.0.0"
description = "Worker-authenticated command-line interface for Cantrip"
authors = ["Cantrip"]
edition = "2024"
license = "UNLICENSED"
publish = false

[[bin]]
name = "cantrip"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
tempfile = "3.21.0"

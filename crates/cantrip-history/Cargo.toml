[package]
name = "cantrip-history"
version = "0.0.0"
description = "Encrypted worker-local native history evidence and replay"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
cantrip-crypto = { path = "../cantrip-crypto" }
cantrip-host = { path = "../cantrip-host" }
cantrip-protocol = { path = "../cantrip-protocol" }
cantrip-wire = { path = "../cantrip-wire" }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

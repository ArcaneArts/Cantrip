[package]
name = "cantrip-transport"
version = "0.0.0"
description = "Cantrip transport queues, subscriptions, deadlines, and lifecycle mechanisms"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
cantrip-wire = { path = "../cantrip-wire" }
cantrip-framing = { path = "../cantrip-framing" }
futures = "0.3"
indexmap = "2.14"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

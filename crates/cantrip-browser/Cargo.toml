[package]
name = "cantrip-browser"
version = "0.0.0"
description = "Owned Chromium processes and direct DevTools sessions"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
cantrip-host = { path = "../cantrip-host" }
cantrip-transport = { path = "../cantrip-transport" }
cantrip-wire = { path = "../cantrip-wire" }
futures = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
url = "2.5"
uuid = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
codex-utils-pty = { package = "cantrip-pty", path = "../cantrip-pty" }

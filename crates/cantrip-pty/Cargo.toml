[package]
edition.workspace = true
license = "Apache-2.0"
name = "cantrip-pty"
version = "0.166.0"
publish.workspace = true

[dependencies]
anyhow = "1"
portable-pty = "0.9.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
ctor = "0.6.3"
tempfile = "3.23.0"
pretty_assertions = "1.4.1"

[target.'cfg(windows)'.dependencies]
filedescriptor = "0.8.3"
lazy_static = "1"
log = "0.4"
shared_library = "0.1.9"
winapi = { version = "0.3.9", features = [
    "std",
    "handleapi",
    "jobapi",
    "jobapi2",
    "libloaderapi",
    "minwinbase",
    "processthreadsapi",
    "synchapi",
    "winbase",
    "wincon",
    "winerror",
    "winnt",
] }
[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[lib]
name = "codex_utils_pty"
doctest = false

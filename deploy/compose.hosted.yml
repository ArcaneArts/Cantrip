name: cantrip

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis-data:/data

  server:
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
    image: cantrip-server:${CANTRIP_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CANTRIP_ACTIVE_SECRET_ENCRYPTION_KEY_ID: ${CANTRIP_ACTIVE_SECRET_ENCRYPTION_KEY_ID:?set active encryption key id}
      CANTRIP_ADMIN_BOOTSTRAP_TOKEN: ${CANTRIP_ADMIN_BOOTSTRAP_TOKEN:-}
      CANTRIP_APP_ORIGINS: ${CANTRIP_APP_ORIGIN:?set application origin}
      CANTRIP_AUTH_MODE: accounts
      CANTRIP_BOOTSTRAP_MODE: hosted
      CANTRIP_CODE_SURFACE_HOST: 0.0.0.0
      CANTRIP_CODE_SURFACE_ORIGIN: https://${CANTRIP_CODE_DOMAIN:?set Code domain}
      CANTRIP_CODE_SURFACE_PORT: 4311
      CANTRIP_DATA_DIR: /var/lib/cantrip
      CANTRIP_DEPLOYMENT_MODE: hosted
      CANTRIP_PUBLIC_ORIGIN: https://${CANTRIP_API_DOMAIN:?set API domain}
      CANTRIP_PUBLIC_REGISTRATION: ${CANTRIP_PUBLIC_REGISTRATION:-false}
      CANTRIP_METRICS_TOKEN: ${CANTRIP_METRICS_TOKEN:-}
      CANTRIP_ACCOUNT_REMOTE_SURFACE_LIMIT: ${CANTRIP_ACCOUNT_REMOTE_SURFACE_LIMIT:-16}
      CANTRIP_WORKER_REMOTE_SURFACE_LIMIT: ${CANTRIP_WORKER_REMOTE_SURFACE_LIMIT:-8}
      CANTRIP_ACCOUNT_UPLOAD_BYTES_PER_MINUTE: ${CANTRIP_ACCOUNT_UPLOAD_BYTES_PER_MINUTE:-268435456}
      CANTRIP_WORKER_UPLOAD_BYTES_PER_MINUTE: ${CANTRIP_WORKER_UPLOAD_BYTES_PER_MINUTE:-134217728}
      CANTRIP_ACCOUNT_RELAY_BYTES_PER_MINUTE: ${CANTRIP_ACCOUNT_RELAY_BYTES_PER_MINUTE:-536870912}
      CANTRIP_WORKER_RELAY_BYTES_PER_MINUTE: ${CANTRIP_WORKER_RELAY_BYTES_PER_MINUTE:-268435456}
      CANTRIP_SECRET_ENCRYPTION_KEYS: ${CANTRIP_SECRET_ENCRYPTION_KEYS:?set encryption keyring}
      CANTRIP_SERVER_HOST: 0.0.0.0
      CANTRIP_SERVER_PORT: 4310
      CANTRIP_TRUSTED_PROXIES: 10.89.0.10/32
      CANTRIP_TURN_SHARED_SECRET: ${CANTRIP_TURN_SHARED_SECRET:-}
      CANTRIP_TURN_URLS: ${CANTRIP_TURN_URLS:-}
      DATABASE_URL: ${DATABASE_URL:?set PostgreSQL connection URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test:
        [
          "CMD",
          "/opt/cantrip/runtime/node",
          "-e",
          "fetch('http://127.0.0.1:4310/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:4310:4310"
      - "127.0.0.1:4311:4311"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - server-data:/var/lib/cantrip

  worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
    image: cantrip-worker:${CANTRIP_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      CANTRIP_SERVER_URL: https://${CANTRIP_API_DOMAIN:?set API domain}
      CANTRIP_WORKER_DATA_DIR: /var/lib/cantrip-worker
      CANTRIP_WORKER_ENROLLMENT_CODE: ${CANTRIP_WORKER_ENROLLMENT_CODE:-}
      CANTRIP_WORKER_NAME: ${CANTRIP_WORKER_NAME:-Hosted Worker}
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=1g,mode=1777
    volumes:
      - worker-data:/var/lib/cantrip-worker

  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      CANTRIP_API_DOMAIN: ${CANTRIP_API_DOMAIN:?set API domain}
      CANTRIP_CODE_DOMAIN: ${CANTRIP_CODE_DOMAIN:?set Code domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      default:
        ipv4_address: 10.89.0.10
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
      - caddy-data:/data

volumes:
  caddy-config:
  caddy-data:
  postgres-data:
  redis-data:
  server-data:
  worker-data:

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24

[package]
name = "webrtc"
version = "0.21.1"
authors = ["Rain Liu <yliu@webrtc.rs>"]
edition = "2024"
license = "MIT/Apache-2.0"
homepage = "https://webrtc.rs"
documentation = "https://docs.rs/webrtc"
repository = "https://github.com/webrtc-rs/webrtc"
keywords = ["sansio", "networking", "protocols"]
categories = ["network-programming"]
description = "Async-friendly WebRTC implementation in Rust"

[features]
default = ["runtime-tokio", "crypto-ring"]
# Runtime features are purely additive: each one only makes a built-in `Runtime`
# implementation available. They never select which primitives the library uses,
# so enabling both is safe and a process may drive connections on either.
runtime-tokio = ["dep:tokio"]
runtime-smol = ["dep:smol"]
# Deterministic virtual-clock runtime (`MockRuntime`). Test-only: it implements the same
# `Runtime` trait as the two above, but drives timers from a manually advanced clock and
# does not perform I/O.
runtime-mock = []
# Crypto provider features forward to `rtc` and are additive, matching the core semantics:
# enabling both compiles both built-in providers and `ring` remains the default selection.
# A `--no-default-features` build has no built-in provider and requires the application to
# supply one through `SettingEngine::set_crypto_provider`.
crypto-ring = ["rtc/crypto-ring"]
crypto-aws-lc-rs = ["rtc/crypto-aws-lc-rs"]

[dependencies]
rtc = { version = "0.21.1", default-features = false }

bytes = "1.12.0"
async-trait = "0.1.89"
log = "0.4.33"
futures = "0.3.32"

# Executor-agnostic primitives. These are plain data structures driven by wakers,
# so they work on any runtime and are NOT feature-gated — only reactor-bound
# operations (timers, I/O, spawning) go through the `Runtime` trait.
async-channel = "2.5.0"
async-broadcast = "0.7.2"
event-listener = "5.4.1"
quinn-udp = { version = "0.6.1", default-features = false, features = ["log"] }

# Async runtimes (all optional)
tokio = { version = "1.52.3", features = ["net", "time", "sync", "rt", "rt-multi-thread"], optional = true }
smol = { version = "2.0.2", optional = true }

[dev-dependencies]
socket2 = "0.6.5"

name: cantrip-account-server-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cantrip_accounts
      POSTGRES_PASSWORD: cantrip
      POSTGRES_USER: cantrip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cantrip -d cantrip_accounts"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:54330:5432"
    tmpfs:
      - /var/lib/postgresql
    stop_grace_period: 3s

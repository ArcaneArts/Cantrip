[package]
name = "cantrip-server"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
native-tls = "0.2"
os_pipe = "1"
pglite-rs = { version = "=0.2.7", default-features = false }
postgres-native-tls = "0.5"
postgres-types = { version = "0.2", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "debuginfo"
lto = "thin"

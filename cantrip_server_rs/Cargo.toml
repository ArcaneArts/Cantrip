[package]
name = "cantrip-server"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
getrandom = { version = "0.3", features = ["std"] }
native-tls = "0.2"
os_pipe = "1"
pglite-rs = { version = "=0.2.7", default-features = false }
postgres-native-tls = "0.5"
postgres-types = { version = "0.2", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"
unicode-normalization = "0.1"
regress = { version = "0.12", features = ["utf16"] }
ryu-js = "1.0"
indexmap = "2.14"
percent-encoding = "2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "debuginfo"
lto = "thin"

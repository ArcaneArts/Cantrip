[package]
name = "cantrip-server"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
deadpool = { version = "=0.12.3", default-features = false, features = ["managed"] }
futures = "0.3"
flate2 = "1"
getrandom = { version = "0.3", features = ["std"] }
native-tls = "0.2"
os_pipe = "1"
parking_lot = "0.12"
pglite-rs = { version = "=0.2.7", path = "third-party/pglite-rs", default-features = false }
postgres-native-tls = "0.5"
postgres-types = { version = "0.2", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
regex = "1"
reqwest = { version = "=0.13.4", default-features = false, features = ["native-tls", "gzip", "deflate", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"
unicode-normalization = "0.1"
regress = { version = "0.12", features = ["utf16"] }
ryu-js = "1.0"
indexmap = "2.14"
percent-encoding = "2.3"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-tungstenite = { version = "0.29", default-features = false }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
http-body = "1"
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
icu_collator = { version = "=2.1.1", path = "third-party/icu_collator" }
icu_locale_core = "2.4"
sys-locale = "0.3.2"
jiff = { version = "0.2.37", features = ["tzdb-bundle-always"] }
num-bigint = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[patch.crates-io]
hyper = { path = "third-party/hyper" }

[dev-dependencies]
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
ed25519-dalek = "2"
futures-util = "0.3"
desktop-tokio-tungstenite = { package = "tokio-tungstenite", version = "0.28", features = ["native-tls"] }
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
zeroize = "1"

[profile.release]
strip = "debuginfo"
lto = "thin"

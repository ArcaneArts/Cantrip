name: Editor recovery harness contracts

on:
  pull_request:
    paths:
      - scripts/qa/**
      - scripts/network-tranche-two-acceptance*
      - scripts/codex-built-runtime.test.mjs
      - cantrip_app/src/lib/worker-link-peer-carrier*
      - cantrip_app/src/components/settings/settings-page.test.tsx
      - .github/workflows/editor-recovery-harness.yml
  workflow_dispatch:

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cantrip/version --filter @cantrip/logging --filter @cantrip/protocol --filter @cantrip/crypto --filter @cantrip/glitch -r build
      - run: node --check scripts/qa/editor-recovery-browser.mjs
      - run: node --check scripts/qa/editor-recovery-fixture.mjs
      - run: node --test scripts/network-tranche-two-acceptance.test.mjs scripts/codex-built-runtime.test.mjs
      - run: pnpm --filter @cantrip/app exec vitest run src/lib/worker-link-peer-carrier.test.ts src/components/settings/settings-page.test.tsx --maxWorkers=2

name: Editor recovery harness contracts

on:
  pull_request:
    paths:
      - scripts/qa/**
      - scripts/network-tranche-two-acceptance*
      - scripts/codex-built-runtime.test.mjs
      - cantrip_app/src/lib/worker-link-peer-carrier*
      - cantrip_app/public/cantrip-code-*.js
      - cantrip_app/src/lib/cantrip-code-*.test.ts
      - cantrip_worker/src/tunnel-tcp-adapter.ts
      - cantrip_worker/test/tunnel-tcp-adapter.test.ts
      - cantrip_app/src/components/code/**
      - cantrip_app/src/components/editor/**
      - cantrip_worker/src/code/workbench-bridge.ts
      - cantrip_worker/src/code/supervisor.ts
      - cantrip_worker/test/code-supervisor.test.ts
      - cantrip_worker/src/managed-runtimes/**
      - cantrip_worker/src/codegraph/archive.ts
      - cantrip_worker/src/codegraph/runtime.ts
      - cantrip_worker/src/index.ts
      - cantrip_worker/test/runtime-archive-shutdown.test.ts
      - cantrip_worker/test/runtime-shutdown.test.ts
      - cantrip_worker/test/worker-link-ice-shutdown.test.ts
      - patches/werift@*.patch
      - cantrip_worker/test/fixtures/runtime-shutdown.ts
      - cantrip_worker/test/managed-runtime.test.ts
      - cantrip_worker/test/searxng-runtime.test.ts
      - cantrip_worker/test/playwright-runtime-manager.test.ts
      - cantrip_worker/test/codegraph-runtime.test.ts
      - cantrip_worker/test/code-workbench-bridge.test.ts
      - cantrip_app/src/components/settings/settings-page.test.tsx
      - cantrip_server/src/server-entry-runtime.ts
      - cantrip_server/src/server-shutdown.ts
      - cantrip_server/src/code/**
      - cantrip_server/test/server-shutdown*.test.ts
      - cantrip_server/test/fixtures/server-shutdown.ts
      - .github/workflows/editor-recovery-harness.yml
  workflow_dispatch:

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cantrip/version --filter @cantrip/logging --filter @cantrip/protocol --filter @cantrip/crypto --filter @cantrip/glitch -r build
      - run: node --check scripts/qa/editor-recovery-fixture.mjs
      - run: node --check scripts/qa/editor-repository-fixture.mjs
      - run: node --test scripts/network-tranche-two-acceptance.test.mjs scripts/codex-built-runtime.test.mjs
      - run: pnpm --filter @cantrip/app exec vitest run src/lib/worker-link-peer-carrier.test.ts src/components/editor src/components/code src/lib/native-explorer-window-broker.test.ts src/components/settings/settings-page.test.tsx --maxWorkers=2
      - run: pnpm --filter @cantrip/worker exec vitest run test/code-workbench-bridge.test.ts test/code-supervisor.test.ts test/tunnel-tcp-adapter.test.ts --maxWorkers=1
      - run: pnpm --filter @cantrip/server exec vitest run test/server-shutdown.test.ts test/server-shutdown-handlers.test.ts test/code-tunnel.test.ts test/shared-code-transport.test.ts test/logger-archive.test.ts --maxWorkers=2
      - name: Managed runtime shutdown and ownership
        run: pnpm --filter @cantrip/worker exec vitest run test/runtime-shutdown.test.ts test/runtime-archive-shutdown.test.ts test/managed-runtime.test.ts test/searxng-runtime.test.ts test/playwright-runtime-manager.test.ts test/codegraph-runtime.test.ts src/runtime-loop.test.ts --maxWorkers=2
      - name: ICE shutdown with pending real STUN requests
        run: pnpm --filter @cantrip/worker exec vitest run test/worker-link-ice-shutdown.test.ts --maxWorkers=2

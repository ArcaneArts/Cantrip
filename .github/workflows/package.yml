name: Release native bundles

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  server:
    name: Server (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:server --target ${{ matrix.target }}
      - run: node scripts/archive-distribution.mjs server --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cantrip-server-${{ matrix.target }}
          path: artifacts/bundles/${{ matrix.target }}/cantrip-server-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  worker:
    name: Worker (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:worker --target ${{ matrix.target }}
      - run: node scripts/archive-distribution.mjs worker --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cantrip-worker-${{ matrix.target }}
          path: artifacts/bundles/${{ matrix.target }}/cantrip-worker-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  client:
    name: Client (${{ matrix.target }})
    needs: [server, worker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: actions/download-artifact@v4
        with:
          name: cantrip-server-${{ matrix.target }}
          path: artifacts/incoming/server
      - uses: actions/download-artifact@v4
        with:
          name: cantrip-worker-${{ matrix.target }}
          path: artifacts/incoming/worker
      - name: Materialize embedded services
        shell: bash
        run: |
          tar -xzf "artifacts/incoming/server/cantrip-server-${{ matrix.target }}.tar.gz" -C artifacts
          tar -xzf "artifacts/incoming/worker/cantrip-worker-${{ matrix.target }}.tar.gz" -C artifacts
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:app --target ${{ matrix.target }} --from-artifacts
      - run: node scripts/archive-distribution.mjs client --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cantrip-client-${{ matrix.target }}
          path: artifacts/bundles/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [server, worker, client]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cantrip-*
          merge-multiple: true
          path: release-assets
      - name: Create release and upload native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="release-${GITHUB_SHA}"
          mapfile -d '' files < <(find release-assets -type f -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "Cantrip ${GITHUB_SHA:0:12}"
          fi

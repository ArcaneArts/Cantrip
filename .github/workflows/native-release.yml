name: Release native bundles

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: native-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: Server (${{ matrix.target }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            target: darwin-arm64
          - runner: blacksmith-2vcpu-windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:server --target ${{ matrix.target }}
      - run: node scripts/archive-distribution.mjs server --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cantrip-server-${{ matrix.target }}
          path: artifacts/bundles/${{ matrix.target }}/cantrip-server-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  worker:
    name: Worker (${{ matrix.target }})
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            target: darwin-arm64
          - runner: blacksmith-8vcpu-windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable long Windows paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Install Windows native prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress --yes
          nasm -v
          $component = "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre"
          $installerRoot = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $installerRoot "vswhere.exe"
          $setup = Join-Path $installerRoot "setup.exe"
          $installation = @(
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          ) | Select-Object -First 1
          if (!$installation) {
            throw "Visual Studio C++ Build Tools are not installed."
          }
          $spectreInstallation = @(
            & $vswhere -latest -products * -requires $component -property installationPath
          ) | Select-Object -First 1
          if (!$spectreInstallation) {
            Write-Host "Installing Visual Studio Spectre-mitigated x64/x86 libraries..."
            $arguments = @(
              "modify",
              "--installPath", "`"$installation`"",
              "--add", $component,
              "--quiet",
              "--norestart"
            )
            $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
            if (@(0, 3010) -notcontains $process.ExitCode) {
              throw "Visual Studio Installer failed with exit code $($process.ExitCode)."
            }
          }
          $spectreInstallation = @(
            & $vswhere -latest -products * -requires $component -property installationPath
          ) | Select-Object -First 1
          if (!$spectreInstallation) {
            throw "Visual Studio Spectre-mitigated x64/x86 libraries are unavailable after installation."
          }
          Write-Host "Visual Studio Spectre libraries found at $spectreInstallation"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: worker-${{ matrix.target }}
          workspaces: cantrip_cli -> target
      - name: Restore verified Codex runtime
        id: codex-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: cantrip_codex/.build/${{ matrix.target }}/bundle
          key: cantrip-codex-bundle-${{ matrix.target }}-${{ hashFiles('cantrip_codex/upstream.json', 'cantrip_codex/upstream.files.json', 'cantrip_codex/patches/**', 'scripts/cantrip-codex/**') }}
      - name: Restore Codex rusty_v8 downloads
        id: codex-v8-cache
        uses: actions/cache/restore@v4
        with:
          path: cantrip_codex/.build/${{ matrix.target }}/rusty-v8
          key: cantrip-codex-rusty-v8-${{ matrix.target }}-${{ hashFiles('cantrip_codex/upstream/codex-rs/Cargo.lock') }}
          restore-keys: |
            cantrip-codex-rusty-v8-${{ matrix.target }}-
      - name: Resolve Cantrip Code build fingerprint
        id: code-fingerprint
        shell: bash
        run: |
          fingerprint="$(node --input-type=module -e "import { calculateBuildFingerprint } from './scripts/cantrip-code/build-lib.mjs'; process.stdout.write(await calculateBuildFingerprint('${{ matrix.target }}'))")"
          echo "value=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore verified Cantrip Code distribution
        id: code-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: .cantrip-code/cache/builds/${{ matrix.target }}/${{ steps.code-fingerprint.outputs.value }}
          key: cantrip-code-build-${{ matrix.target }}-${{ steps.code-fingerprint.outputs.value }}
      - name: Restore Cantrip Code build downloads
        id: code-dependencies-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cantrip-code/cache/npm
            .cantrip-code/cache/toolchains
          key: cantrip-code-dependencies-${{ matrix.target }}-${{ hashFiles('cantrip_code/upstream/.nvmrc', 'cantrip_code/upstream/package-lock.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Build Codex runtime
        run: pnpm codex:build
      - name: Save verified Codex runtime
        if: steps.codex-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: cantrip_codex/.build/${{ matrix.target }}/bundle
          key: cantrip-codex-bundle-${{ matrix.target }}-${{ hashFiles('cantrip_codex/upstream.json', 'cantrip_codex/upstream.files.json', 'cantrip_codex/patches/**', 'scripts/cantrip-codex/**') }}
      - name: Save Codex rusty_v8 downloads
        if: steps.codex-runtime-cache.outputs.cache-hit != 'true' && steps.codex-v8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: cantrip_codex/.build/${{ matrix.target }}/rusty-v8
          key: cantrip-codex-rusty-v8-${{ matrix.target }}-${{ hashFiles('cantrip_codex/upstream/codex-rs/Cargo.lock') }}
      - name: Build Cantrip CLI
        run: pnpm cli:build:release
      - name: Build Cantrip Code
        run: pnpm code:build --target ${{ matrix.target }}
      - name: Save verified Cantrip Code distribution
        if: steps.code-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cantrip-code/cache/builds/${{ matrix.target }}/${{ steps.code-fingerprint.outputs.value }}
          key: cantrip-code-build-${{ matrix.target }}-${{ steps.code-fingerprint.outputs.value }}
      - name: Save Cantrip Code build downloads
        if: steps.code-runtime-cache.outputs.cache-hit != 'true' && steps.code-dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cantrip-code/cache/npm
            .cantrip-code/cache/toolchains
          key: cantrip-code-dependencies-${{ matrix.target }}-${{ hashFiles('cantrip_code/upstream/.nvmrc', 'cantrip_code/upstream/package-lock.json') }}
      - name: Package worker from verified runtimes
        run: pnpm package:worker --target ${{ matrix.target }}
      - run: node scripts/archive-distribution.mjs worker --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cantrip-worker-${{ matrix.target }}
          path: artifacts/bundles/${{ matrix.target }}/cantrip-worker-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Build mobile workspace dependencies
        run: pnpm --filter @cantrip/logging build && pnpm --filter @cantrip/protocol build
      - name: Synchronize Android project
        run: pnpm --filter @cantrip/app cap:sync android
      - name: Restore Android upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            "$ANDROID_UPLOAD_KEYSTORE_BASE64" \
            "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
            "$ANDROID_UPLOAD_KEY_ALIAS" \
            "$ANDROID_UPLOAD_KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "Android upload signing secrets are incomplete." >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/cantrip-android-upload.keystore"
          chmod 600 "$RUNNER_TEMP/cantrip-android-upload.keystore"
      - name: Build signed Android release
        env:
          CANTRIP_ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/cantrip-android-upload.keystore
          CANTRIP_ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          CANTRIP_ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          CANTRIP_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          pushd cantrip_app/android
          ./gradlew --no-daemon bundleRelease assembleRelease
          popd
          bundle="cantrip_app/android/app/build/outputs/bundle/release/app-release.aab"
          apk="cantrip_app/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$bundle" || { echo "Gradle did not produce $bundle." >&2; exit 1; }
          test -f "$apk" || { echo "Gradle did not produce $apk." >&2; exit 1; }
          jarsigner -verify "$bundle"
          version="$(node scripts/version.mjs)"
          output="artifacts/mobile/android"
          mkdir -p "$output"
          cp "$bundle" "$output/Cantrip_${version}_android.aab"
          cp "$apk" "$output/Cantrip_${version}_android.apk"
      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: cantrip-android-release
          path: |
            artifacts/mobile/android/*.aab
            artifacts/mobile/android/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove Android upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/cantrip-android-upload.keystore"

  ios:
    name: iOS TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Build mobile workspace dependencies
        run: pnpm --filter @cantrip/logging build && pnpm --filter @cantrip/protocol build
      - name: Synchronize iOS project
        run: pnpm --filter @cantrip/app cap:sync ios
      - name: Import Apple Distribution certificate
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${IOS_DISTRIBUTION_CERTIFICATE:?Configure the IOS_DISTRIBUTION_CERTIFICATE Actions secret.}"
          : "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:?Configure the IOS_DISTRIBUTION_CERTIFICATE_PASSWORD Actions secret.}"
          : "${KEYCHAIN_PASSWORD:?Configure the KEYCHAIN_PASSWORD Actions secret.}"
          certificate="$RUNNER_TEMP/cantrip-ios-distribution.p12"
          keychain="$RUNNER_TEMP/cantrip-ios-signing.keychain-db"
          leaf_certificate="$RUNNER_TEMP/cantrip-ios-distribution-leaf.pem"
          echo "CANTRIP_IOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE" | openssl base64 -d -A -out "$certificate"

          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychain="${existing_keychain//\"/}"
            existing_keychain="${existing_keychain#"${existing_keychain%%[![:space:]]*}"}"
            if [ -n "$existing_keychain" ]; then
              existing_keychains+=("$existing_keychain")
            fi
          done < <(security list-keychains -d user)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain"

          security find-certificate \
            -a \
            -c 'Apple Distribution' \
            -p \
            "$keychain" \
            > "$leaf_certificate"
          if [ ! -s "$leaf_certificate" ]; then
            echo "IOS_DISTRIBUTION_CERTIFICATE does not contain an Apple Distribution certificate." >&2
            exit 1
          fi
          team_id="$(
            openssl x509 -in "$leaf_certificate" -noout -subject -nameopt RFC2253 \
              | sed -nE 's/.*OU=([^,]+).*/\1/p'
          )"
          if [ -z "$team_id" ]; then
            echo "Could not determine the Apple team ID from the distribution certificate." >&2
            exit 1
          fi
          identities="$(security find-identity -v -p codesigning "$keychain" || true)"
          if ! printf '%s\n' "$identities" | grep -q 'Apple Distribution:'; then
            printf '%s\n' "$identities" >&2
            echo "The imported Apple Distribution certificate and private key did not form a valid code-signing identity." >&2
            exit 1
          fi
          rm -f "$certificate" "$leaf_certificate"
          echo "CANTRIP_IOS_TEAM_ID=$team_id" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY:?Configure the APPSTORE_CONNECT_KEY_ID Actions secret.}"
          : "${APPLE_API_PRIVATE_KEY:?Configure the APPSTORE_CONNECT_KEY Actions secret.}"
          private_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          echo "CANTRIP_IOS_API_KEY_PATH=$private_key" >> "$GITHUB_ENV"
          if [[ "$APPLE_API_PRIVATE_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$private_key"
          else
            printf '%s' "$APPLE_API_PRIVATE_KEY" | openssl base64 -d -A -out "$private_key"
          fi
          openssl pkey -in "$private_key" -noout
          chmod 600 "$private_key"
      - name: Archive iOS application
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER:?Configure the APPSTORE_CONNECT_ISSUER_ID Actions secret.}"
          : "${APPLE_API_KEY:?Configure the APPSTORE_CONNECT_KEY_ID Actions secret.}"
          xcodebuild \
            -project cantrip_app/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Cantrip.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CANTRIP_IOS_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            DEVELOPMENT_TEAM="$CANTRIP_IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive
      - name: Upload iOS application to TestFlight
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Cantrip.xcarchive" \
            -exportPath "$RUNNER_TEMP/Cantrip-TestFlight" \
            -exportOptionsPlist cantrip_app/ios/App/TestFlightExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CANTRIP_IOS_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"
      - name: Remove temporary iOS signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${CANTRIP_IOS_KEYCHAIN:-}" ]; then
            security delete-keychain "$CANTRIP_IOS_KEYCHAIN" || true
          fi
          if [ -n "${CANTRIP_IOS_API_KEY_PATH:-}" ]; then
            rm -f "$CANTRIP_IOS_API_KEY_PATH"
          fi

  client:
    name: Desktop (${{ matrix.target }})
    needs: [server, worker]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            target: darwin-arm64
          - runner: blacksmith-4vcpu-windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable long Windows paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: desktop-${{ matrix.target }}
          workspaces: cantrip_app/src-tauri -> target
      - uses: actions/download-artifact@v4
        with:
          name: cantrip-server-${{ matrix.target }}
          path: artifacts/incoming/server
      - uses: actions/download-artifact@v4
        with:
          name: cantrip-worker-${{ matrix.target }}
          path: artifacts/incoming/worker
      - name: Materialize embedded services
        shell: bash
        run: |
          tar -xzf "artifacts/incoming/server/cantrip-server-${{ matrix.target }}.tar.gz" -C artifacts
          tar -xzf "artifacts/incoming/worker/cantrip-worker-${{ matrix.target }}.tar.gz" -C artifacts
      - run: pnpm install --frozen-lockfile
      - name: Build desktop workspace dependencies
        run: pnpm --filter @cantrip/protocol build
      - name: Require updater signing material
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?Configure the TAURI_SIGNING_PRIVATE_KEY Actions secret.}"
          : "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:?Configure the TAURI_SIGNING_PRIVATE_KEY_PASSWORD Actions secret.}"
      - name: Import macOS Developer ID certificate
        if: matrix.target == 'darwin-arm64'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?Configure the APPLE_CERTIFICATE Actions secret.}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Configure the APPLE_CERTIFICATE_PASSWORD Actions secret.}"
          : "${KEYCHAIN_PASSWORD:?Configure the KEYCHAIN_PASSWORD Actions secret.}"
          certificate="$RUNNER_TEMP/cantrip-signing.p12"
          keychain="$RUNNER_TEMP/cantrip-signing.keychain-db"
          developer_id_g1="$RUNNER_TEMP/DeveloperIDCA.cer"
          developer_id_g2="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          leaf_certificate="$RUNNER_TEMP/cantrip-signing-leaf.pem"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate"

          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychain="${existing_keychain//\"/}"
            existing_keychain="${existing_keychain#"${existing_keychain%%[![:space:]]*}"}"
            if [ -n "$existing_keychain" ]; then
              existing_keychains+=("$existing_keychain")
            fi
          done < <(security list-keychains -d user)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
            --output "$developer_id_g1"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$developer_id_g2"
          printf '%s  %s\n' \
            '7afc9d01a62f03a2de9637936d4afe68090d2de18d03f29c88cfb0b1ba63587f' \
            "$developer_id_g1" \
            'f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a' \
            "$developer_id_g2" \
            | shasum -a 256 --check
          security import "$developer_id_g1" -k "$keychain"
          security import "$developer_id_g2" -k "$keychain"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain"

          security find-certificate \
            -a \
            -c 'Developer ID Application' \
            -p \
            "$keychain" \
            > "$leaf_certificate"
          if [ ! -s "$leaf_certificate" ]; then
            echo "APPLE_CERTIFICATE does not contain a Developer ID Application certificate." >&2
            exit 1
          fi
          openssl x509 -in "$leaf_certificate" -noout -subject -issuer -dates
          leaf_fingerprint="$(
            openssl x509 -in "$leaf_certificate" -noout -fingerprint -sha1 \
              | cut -d= -f2 \
              | tr -d ':'
          )"
          identities="$(security find-identity -v -p codesigning || true)"
          identity="$(
            printf '%s\n' "$identities" \
              | awk -v fingerprint="$leaf_fingerprint" '
                  $2 == fingerprint && /"Developer ID Application:/ {
                    line = $0
                    sub(/^[^"]*"/, "", line)
                    sub(/".*$/, "", line)
                    print line
                    exit
                  }
                '
          )"
          if [ -z "$identity" ]; then
            printf '%s\n' "$identities" >&2
            echo "The imported Developer ID Application certificate and private key did not form a valid code-signing identity." >&2
            exit 1
          fi
          rm -f "$certificate" "$developer_id_g1" "$developer_id_g2" "$leaf_certificate"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "CANTRIP_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Prepare Apple notarization key
        if: matrix.target == 'darwin-arm64'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY:?Configure the APPSTORE_CONNECT_KEY_ID Actions secret.}"
          : "${APPLE_API_PRIVATE_KEY:?Configure the APPSTORE_CONNECT_KEY Actions secret.}"
          private_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          if [[ "$APPLE_API_PRIVATE_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$private_key"
          else
            printf '%s' "$APPLE_API_PRIVATE_KEY" | openssl base64 -d -A -out "$private_key"
          fi
          openssl pkey -in "$private_key" -noout
          chmod 600 "$private_key"
          echo "APPLE_API_KEY_PATH=$private_key" >> "$GITHUB_ENV"
      - name: Package signed and notarized macOS updater and DMG
        if: matrix.target == 'darwin-arm64'
        shell: bash
        env:
          CANTRIP_REQUIRE_MACOS_SIGNING: "1"
          CANTRIP_REQUIRE_MACOS_NOTARIZATION: "1"
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER:?Configure the APPSTORE_CONNECT_ISSUER_ID Actions secret.}"
          : "${APPLE_API_KEY:?Configure the APPSTORE_CONNECT_KEY_ID Actions secret.}"
          pnpm package:app --target ${{ matrix.target }} --from-artifacts
      - name: Package signed Windows NSIS updater and installer
        if: matrix.target == 'win32-x64'
        env:
          CANTRIP_WINDOWS_BUNDLE: nsis
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm package:app --target ${{ matrix.target }} --from-artifacts
      - run: node scripts/archive-distribution.mjs client --target ${{ matrix.target }}
      - name: Upload macOS desktop artifacts
        if: matrix.target == 'darwin-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: cantrip-desktop-${{ matrix.target }}
          path: |
            artifacts/bundles/darwin-arm64/*.dmg
            artifacts/bundles/darwin-arm64/*.app.tar.gz
            artifacts/bundles/darwin-arm64/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows desktop artifacts
        if: matrix.target == 'win32-x64'
        uses: actions/upload-artifact@v4
        with:
          name: cantrip-desktop-${{ matrix.target }}
          path: |
            artifacts/bundles/win32-x64/*-setup.exe
            artifacts/bundles/win32-x64/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing keychain
        if: always() && matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          if [ -n "${CANTRIP_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$CANTRIP_SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi

  release:
    name: Publish GitHub release
    needs: [server, worker, client, android, ios]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: cantrip-*
          merge-multiple: true
          path: release-assets
      - name: Create versioned release and upload native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/version.mjs)"
          tag="v${version}"
          release_notes="$RUNNER_TEMP/cantrip-release-notes.md"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          if gh release view "$tag" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "Release $tag already targets $target instead of $GITHUB_SHA." >&2
              exit 1
            fi
            gh release view "$tag" --json body --jq '.body // ""' > "$release_notes"
          else
            gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
              -f "tag_name=$tag" \
              -f "target_commitish=$GITHUB_SHA" \
              --jq .body > "$release_notes"
          fi
          node scripts/generate-updater-manifest.mjs \
            --assets release-assets \
            --base-url "https://github.com/$GH_REPO/releases/download/$tag" \
            --notes "$release_notes" \
            --output release-assets/latest.json \
            --published-at "$published_at" \
            --version "$version"
          mapfile -d '' files < <(find release-assets -type f ! -name latest.json -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$release_notes"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --draft \
              --notes-file "$release_notes" \
              --target "$GITHUB_SHA" \
              --title "Cantrip ${version}"
          fi
          gh release upload "$tag" release-assets/latest.json --clobber
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$tag" --draft=false
          fi

name: Editor lifecycle

on:
  pull_request:
    paths:
      - ".github/workflows/editor-lifecycle.yml"
      - "cantrip_app/src/lib/code-workbench*"
      - "cantrip_app/src/lib/serialized-attachment-lifecycle*"
      - "cantrip_app/src/components/code/**"
      - "cantrip_app/src/components/explorer/*code*"
      - "cantrip_code/patches/**"
      - "cantrip_code/extensions/**"
      - "scripts/cantrip-code/**"

permissions:
  contents: read

concurrency:
  group: editor-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Editor lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cantrip/version --filter @cantrip/logging --filter @cantrip/protocol --filter @cantrip/crypto --filter @cantrip/glitch -r build
      - name: Execute patched upstream readiness behavior
        run: node --test scripts/cantrip-code/workbench-readiness.test.mjs
      - name: Execute frame ownership and readiness behavior
        if: ${{ !cancelled() }}
        run: pnpm --filter @cantrip/app exec vitest run src/lib/code-workbench-lifecycle.test.ts src/lib/code-workbench-frame.test.ts src/lib/serialized-attachment-lifecycle.test.ts src/components/code src/components/explorer/explorer-code-editor-lifecycle.test.tsx src/components/explorer/retained-explorer-code-editor.test.tsx src/components/explorer/persistent-explorer-code-ownership.test.tsx --maxWorkers=2

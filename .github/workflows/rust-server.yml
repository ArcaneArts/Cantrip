        run: node --import tsx scripts/server-rust/worker-client-compatibility.mjs --database postgres --report .qa/rust-server/worker-client-external.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-server-${{ matrix.os }}
          path: .qa/rust-server/

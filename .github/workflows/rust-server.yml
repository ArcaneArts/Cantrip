        run: node --import tsx scripts/server-rust/actual-folder-client.mjs --github-conversion --database pglite --report .qa/rust-server/actual-github-conversion-pglite.json
      - name: Conversion durable admission, fencing and rollback with bundled-postgres
        run: node --import tsx scripts/server-rust/conversion-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/conversion-repository-compatibility-bundled-postgres.json
      - name: Conversion HTTP, worker, Live, capacity and recovery with bundled-postgres

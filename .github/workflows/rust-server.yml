        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/server-rust/actual-folder-client.mjs --replicas --github-replicas --database postgres --report .qa/rust-server/actual-replica-product-postgres.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-server-replicas-${{ matrix.os }}
          path: .qa/rust-server/


      - cantrip_app/src/lib/worker-link*.ts
      - cantrip_app/src/lib/worker-observation-client.ts
      - cantrip_app/src/lib/remote-surface-worker-link.ts
      - cantrip_app/src/lib/remote-surface-stream-encryption.ts
      - cantrip_app/src/lib/tunnel-worker-link.ts
      - cantrip_app/src/lib/tunnel-content-encryption.ts
      - cantrip_app/src/lib/api/worker-link.ts
      - cantrip_server/src/app/http/**
      - cantrip_server/src/db/repository/accounts.ts
      - cantrip_server/src/db/encryption-registry.ts
      - packages/protocol/**
      - packages/crypto/**
      - packages/logging/**
      - scripts/server-rust/**
      - scripts/database-transfer/**
      - scripts/cantrip-cli/**
      - scripts/version.mjs
      - version.json
      - package.json
      - .github/workflows/rust-server.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/@zavora-ai__computer-use-mcp@7.0.0.patch
  workflow_dispatch:
    inputs:
      conversion_lifetime_diagnostic:
        description: Run only the repeated Linux HTTP conversion lifetime diagnostic
        type: boolean
        default: false
      discovery_lifetime_diagnostic:
        description: Run only the repeated Linux workspace admission lifetime diagnostic
        type: boolean
        default: false
      native_stack_diagnostic:
        description: Capture the original Windows native PGlite admission stack overflow with GDB
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rust-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.conversion_lifetime_diagnostic && !inputs.discovery_lifetime_diagnostic && !inputs.native_stack_diagnostic) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # The Windows GNU build plus actual Node/Rust storage and transport suites
    # exceeded 60 minutes in run 40473447456 without a failing test.
    timeout-minutes: 120
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - name: Windows native PGlite toolchain
        if: runner.os == 'Windows'
        id: mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-openssl
      - name: Windows Rust target and PostgreSQL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CANTRIP_MINGW_BIN: ${{ steps.mingw.outputs.msys2-location }}\mingw64\bin
        run: |
          rustup target add x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" >> $env:GITHUB_ENV
          "$env:CANTRIP_MINGW_BIN" >> $env:GITHUB_PATH
          "CANTRIP_TEST_POSTGRES_BIN_DIR=$env:PGBIN" >> $env:GITHUB_ENV
      - name: Linux PostgreSQL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libssl-dev
          echo "CANTRIP_TEST_POSTGRES_BIN_DIR=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: macOS PostgreSQL
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "CANTRIP_TEST_POSTGRES_BIN_DIR=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cantrip/version --filter @cantrip/logging --filter @cantrip/protocol --filter @cantrip/crypto --filter @cantrip/glitch -r build
      - name: Shared resource cleanup SQL matches the actual TypeScript helpers
        run: node --import tsx scripts/server-rust/resource-layout-query-manifest.mjs --check
      - name: Browser query statements match the actual TypeScript repository
        run: node --import tsx scripts/server-rust/browser-query-manifest.mjs --check
      - name: File-document query statements match the actual TypeScript repository
        run: node --import tsx scripts/server-rust/file-document-query-manifest.mjs --check
      - name: Early HTTP replies survive upload termination while resets and partial replies fail
        run: node --test scripts/server-rust/streaming-http-request.test.mjs scripts/server-rust/http-connection-trace.test.mjs
      - name: Native HTTP rejections deliver before upload EOF and bound abandoned drains
        run: node scripts/server-rust/cargo.mjs test --lib http::body::tests -- --nocapture
      - name: File-document and surface-stream protocol compatibility
        run: node scripts/server-rust/cargo.mjs test --test file_document_contracts -- --nocapture
      - name: Workspace query statements match the actual TypeScript repositories
        run: node --import tsx scripts/server-rust/workspace-query-manifest.mjs --check
      - name: Workspace protocol and exact validation errors
        run: node scripts/server-rust/cargo.mjs test --test workspace_contracts -- --nocapture
      - name: Workspace commands, imports and resource deletion match the actual shared models
        run: node scripts/server-rust/cargo.mjs test --test workspace_models -- --nocapture
      - name: Workspace repositories and legacy layout cleanup with native PGlite
        env:
          CANTRIP_FIXTURE_STACK_BYTES: "1048576"
        run: node --import tsx scripts/server-rust/workspace-repository-compatibility.mjs --report .qa/rust-server/workspace-repository-pglite.json
      - name: Workspace HTTP, authentication and Live with native PGlite
        run: node --import tsx scripts/server-rust/workspace-http-compatibility.mjs --report .qa/rust-server/workspace-http-pglite.json
      - name: Workspace repositories and legacy layout cleanup with private PostgreSQL
        env:
          CANTRIP_FIXTURE_STACK_BYTES: "1048576"
        run: node --import tsx scripts/server-rust/workspace-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/workspace-repository-bundled.json
      - name: Workspace HTTP, authentication and Live with private PostgreSQL
        run: node --import tsx scripts/server-rust/workspace-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/workspace-http-bundled.json
      - name: Workspace repositories, document authority and commit lock races with external PostgreSQL
        env:
          CANTRIP_FIXTURE_STACK_BYTES: "1048576"
        run: node --import tsx scripts/server-rust/workspace-repository-compatibility.mjs --database postgres --report .qa/rust-server/workspace-repository-external.json
      - name: Workspace HTTP, authentication and Live with external PostgreSQL
        run: node --import tsx scripts/server-rust/workspace-http-compatibility.mjs --database postgres --report .qa/rust-server/workspace-http-external.json
      - name: Concurrent workspace seeds, command receipts and admitted shutdown
        run: node --import tsx scripts/server-rust/workspace-http-lifetimes.mjs --report .qa/rust-server/workspace-http-lifetimes.json
      - name: Project surface SQL matches the actual TypeScript repositories
        run: node --import tsx scripts/server-rust/project-surface-query-manifest.mjs --check
      - name: Project surface protocol and exact validation errors
        run: node scripts/server-rust/cargo.mjs test --test project_surface_contracts -- --nocapture
      - name: Project surface repository state and placement with native PGlite
        run: node --import tsx scripts/server-rust/project-surfaces-repository-compatibility.mjs --database pglite --report .qa/rust-server/project-surfaces-repository-compatibility-pglite.json
      - name: Project surface HTTP, worker routing and ordered Live with native PGlite
        run: node --import tsx scripts/server-rust/project-surface-http-compatibility.mjs --database pglite --report .qa/rust-server/project-surface-http-compatibility-pglite.json
      - name: Project surface repository state and placement with private PostgreSQL
        run: node --import tsx scripts/server-rust/project-surfaces-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/project-surfaces-repository-compatibility-bundled-postgres.json
      - name: Project surface HTTP, worker routing and ordered Live with private PostgreSQL
        run: node --import tsx scripts/server-rust/project-surface-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/project-surface-http-compatibility-bundled-postgres.json
      - name: Project surface repository state and placement with external PostgreSQL
        run: node --import tsx scripts/server-rust/project-surfaces-repository-compatibility.mjs --database postgres --report .qa/rust-server/project-surfaces-repository-compatibility-postgres.json
      - name: Project surface HTTP, worker routing and ordered Live with external PostgreSQL
        run: node --import tsx scripts/server-rust/project-surface-http-compatibility.mjs --database postgres --report .qa/rust-server/project-surface-http-compatibility-postgres.json
      - name: Project surface pin races, retarget fencing and admitted shutdown
        run: node --import tsx scripts/server-rust/project-surface-lifetimes.mjs --report .qa/rust-server/project-surface-lifetimes.json
      - name: Removed plaintext GitHub catalog HTTP compatibility with native PGlite
        run: node --import tsx scripts/server-rust/github-catalog-http-compatibility.mjs --database pglite --report .qa/rust-server/github-catalog-http-pglite.json
      - name: Removed plaintext GitHub catalog HTTP compatibility with private PostgreSQL
        run: node --import tsx scripts/server-rust/github-catalog-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/github-catalog-http-bundled.json
      - name: Removed plaintext GitHub catalog HTTP compatibility with external PostgreSQL
        run: node --import tsx scripts/server-rust/github-catalog-http-compatibility.mjs --database postgres --report .qa/rust-server/github-catalog-http-postgres.json
      - name: Git, worktree and Run wire validation contracts
        run: node scripts/server-rust/cargo.mjs test --test worktree_contracts -- --nocapture
      - name: Git, worktrees and Run admission, retirement and disconnect with native PGlite
        run: node --import tsx scripts/server-rust/project-git-http-compatibility.mjs --database pglite --report .qa/rust-server/project-git-http-pglite.json
      - name: Git, worktrees and Run admission, retirement and disconnect with private PostgreSQL
        run: node --import tsx scripts/server-rust/project-git-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/project-git-http-bundled.json
      - name: Git, worktrees and Run admission, retirement and disconnect with external PostgreSQL
        run: node --import tsx scripts/server-rust/project-git-http-compatibility.mjs --database postgres --report .qa/rust-server/project-git-http-external.json
      - name: Legacy pane query statements match the actual TypeScript repository
        run: node --import tsx scripts/server-rust/layout-query-manifest.mjs --check
      - name: Legacy pane protocol and exact validation errors
        run: node scripts/server-rust/cargo.mjs test --test pane_contracts -- --nocapture
      - name: Legacy pane repositories and durable layout state with native PGlite
        run: node --import tsx scripts/server-rust/layout-repository-compatibility.mjs --report .qa/rust-server/layout-repository-compatibility-pglite.json
      - name: Legacy pane HTTP, authentication and ordered Live notifications with native PGlite
        run: node --import tsx scripts/server-rust/pane-http-compatibility.mjs --report .qa/rust-server/pane-http-compatibility-pglite.json
      - name: Legacy pane repositories and durable layout state with private PostgreSQL
        run: node --import tsx scripts/server-rust/layout-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/layout-repository-compatibility-bundled.json
      - name: Legacy pane HTTP, authentication and ordered Live notifications with private PostgreSQL
        run: node --import tsx scripts/server-rust/pane-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/pane-http-compatibility-bundled.json
      - name: Legacy pane repositories and durable layout state with external PostgreSQL
        run: node --import tsx scripts/server-rust/layout-repository-compatibility.mjs --database postgres --report .qa/rust-server/layout-repository-compatibility-external.json
      - name: Legacy pane HTTP, authentication and ordered Live notifications with external PostgreSQL
        run: node --import tsx scripts/server-rust/pane-http-compatibility.mjs --database postgres --report .qa/rust-server/pane-http-compatibility-external.json
      - name: Legacy pane revision races, read boundaries and admitted shutdown
        run: node --import tsx scripts/server-rust/pane-http-lifetimes.mjs --report .qa/rust-server/pane-http-lifetimes.json
      - name: Shared desktop verifier retains its owning crate's formatting
        run: rustfmt --edition 2021 --check cantrip_app/src-tauri/src/direct_probe_connection.rs
      - name: Terminal HTTP and ordered Live notifications with native PGlite
        run: node --import tsx scripts/server-rust/terminal-http-compatibility.mjs --report .qa/rust-server/terminal-http-pglite.json
      - name: Terminal HTTP and ordered Live notifications with private PostgreSQL
        run: node --import tsx scripts/server-rust/terminal-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/terminal-http-bundled.json
      - name: Terminal HTTP and disconnected creation through shutdown with external PostgreSQL
        run: node --import tsx scripts/server-rust/terminal-http-compatibility.mjs --database postgres --report .qa/rust-server/terminal-http-external.json
      - name: Immutable document repository authority and restart with native PGlite
        run: node --import tsx scripts/server-rust/file-document-repository-compatibility.mjs --report .qa/rust-server/file-document-repository-pglite.json
      - name: File-document HTTP, opaque operations and Live with native PGlite
        run: node --import tsx scripts/server-rust/file-document-http-compatibility.mjs --report .qa/rust-server/file-document-http-pglite.json
      - name: Immutable document repository authority and restart with private PostgreSQL
        run: node --import tsx scripts/server-rust/file-document-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/file-document-repository-bundled.json
      - name: File-document HTTP, opaque operations and Live with private PostgreSQL
        run: node --import tsx scripts/server-rust/file-document-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/file-document-http-bundled.json
      - name: Immutable document repository authority and restart with external PostgreSQL
        run: node --import tsx scripts/server-rust/file-document-repository-compatibility.mjs --database postgres --report .qa/rust-server/file-document-repository-external.json
      - name: File-document HTTP, opaque operations and Live with external PostgreSQL
        run: node --import tsx scripts/server-rust/file-document-http-compatibility.mjs --database postgres --report .qa/rust-server/file-document-http-external.json
      - name: Admitted document creation survives caller disconnect and shutdown
        run: node --import tsx scripts/server-rust/file-document-shutdown.mjs --report .qa/rust-server/file-document-shutdown.json
      - name: Build the production worker used by browser integration
        run: pnpm --filter @cantrip/worker build
      - name: Browser state refresh retains concurrent updates and attachment recipients
        run: pnpm --filter @cantrip/worker exec vitest run test/browser-state-publication.test.ts --maxWorkers=1
      - name: Embedded desktop backend retains worker signal ownership
        run: pnpm --filter @cantrip/worker exec vitest run test/desktop-automation-lifecycle.test.ts --maxWorkers=1
      - name: Browser for unchanged client and worker control integration
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Allow the downloaded Chromium to use its namespace sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: node scripts/server-rust/linux-chromium-sandbox.mjs
      - name: Existing Explorer and Code clients, full worker files and restart with native PGlite
        run: node --import tsx scripts/server-rust/actual-folder-client.mjs --database pglite --project-surfaces --report .qa/rust-server/actual-project-surfaces-pglite.json
      - name: Existing Explorer and Code clients, full worker files and restart with private PostgreSQL
        run: node --import tsx scripts/server-rust/actual-folder-client.mjs --database bundled-postgres --project-surfaces --report .qa/rust-server/actual-project-surfaces-bundled-postgres.json
      - name: Existing Explorer and Code clients, full worker files and restart with external PostgreSQL
        run: node --import tsx scripts/server-rust/actual-folder-client.mjs --database postgres --project-surfaces --report .qa/rust-server/actual-project-surfaces-postgres.json
      - name: Actual browser, server and full worker catalog flow with PGlite
        run: node --import tsx scripts/server-rust/actual-worker-client.mjs --report .qa/rust-server/actual-worker-client-pglite.json
      - name: Actual browser, server and full worker catalog flow with private PostgreSQL
        run: node --import tsx scripts/server-rust/actual-worker-client.mjs --database bundled-postgres --report .qa/rust-server/actual-worker-client-bundled.json
      - name: Actual browser, server and full worker catalog flow with external PostgreSQL
        run: node --import tsx scripts/server-rust/actual-worker-client.mjs --database postgres --report .qa/rust-server/actual-worker-client-external.json
      - name: Execution target descriptor composition and wire ordering
        run: node scripts/server-rust/project-target-catalog-compatibility.mjs --report .qa/rust-server/project-target-catalog.json
      - name: Project placement selection with native PGlite
        run: node scripts/server-rust/project-placement-compatibility.mjs --report .qa/rust-server/project-placement-pglite.json
      - name: Project placement selection with private PostgreSQL
        run: node scripts/server-rust/project-placement-compatibility.mjs --database bundled-postgres --report .qa/rust-server/project-placement-bundled.json

      - name: Replica executor four-job capacity and queued dispatch with bundled-postgres
        run: node --import tsx scripts/server-rust/replica-import-http-compatibility.mjs --database bundled-postgres --connected --faults --reconnect --concurrency --report .qa/rust-server/replica-concurrency-bundled-postgres.json
      - name: Converted-folder replica retention and deletion with bundled-postgres
        run: node --import tsx scripts/server-rust/replica-import-http-compatibility.mjs --database bundled-postgres --connected --faults --reconnect --converted-removal --report .qa/rust-server/replica-converted-bundled-postgres.json
      - name: Replica real lease renewal and stale completion recovery with bundled-postgres
        run: node --import tsx scripts/server-rust/replica-import-http-compatibility.mjs --database bundled-postgres --connected --faults --reconnect --lease-recovery --report .qa/rust-server/replica-lease-bundled-postgres.json
      - name: Replica HTTP admission races, caller disconnect and shutdown ownership
        run: node --import tsx scripts/server-rust/replica-http-lifetimes.mjs --report .qa/rust-server/replica-http-lifetimes.json
      - name: Replica durable leases and transitions with external PostgreSQL
        run: node --import tsx scripts/server-rust/replica-lifecycle-repository-compatibility.mjs --database postgres --report .qa/rust-server/replica-lifecycle-repository-compatibility-postgres.json
      - name: Replica admission and idempotency with external PostgreSQL
        run: node --import tsx scripts/server-rust/replica-admission-repository-compatibility.mjs --database postgres --report .qa/rust-server/replica-admission-repository-compatibility-postgres.json
      - name: Replica completion and source transactions with external PostgreSQL
        run: node --import tsx scripts/server-rust/replica-completion-repository-compatibility.mjs --database postgres --report .qa/rust-server/replica-completion-repository-compatibility-postgres.json
      - name: Replica HTTP validation and error precedence with external PostgreSQL
        run: node --import tsx scripts/server-rust/replica-http-validation-compatibility.mjs --database postgres --report .qa/rust-server/replica-http-validation-compatibility-postgres.json
      - name: Replica protected import, worker transport and recovery with external PostgreSQL
        run: node --import tsx scripts/server-rust/replica-import-http-compatibility.mjs --database postgres --connected --faults --reconnect --shutdown --report .qa/rust-server/replica-import-http-compatibility-postgres.json
      - name: Replica executor four-job capacity and queued dispatch with postgres
        run: node --import tsx scripts/server-rust/replica-import-http-compatibility.mjs --database postgres --connected --faults --reconnect --concurrency --report .qa/rust-server/replica-concurrency-postgres.json
      - name: Converted-folder replica retention and deletion with postgres
        run: node --import tsx scripts/server-rust/replica-import-http-compatibility.mjs --database postgres --connected --faults --reconnect --converted-removal --report .qa/rust-server/replica-converted-postgres.json
      - name: Replica real lease renewal and stale completion recovery with postgres
        run: node --import tsx scripts/server-rust/replica-import-http-compatibility.mjs --database postgres --connected --faults --reconnect --lease-recovery --report .qa/rust-server/replica-lease-postgres.json
      - name: Worker observation lifetime, index retirement and Git safety
        run: pnpm --filter @cantrip/worker exec vitest run test/worktrees.test.ts test/codegraph-supervisor.test.ts test/github.test.ts --maxWorkers=1
      - name: Actual browser local Git and managed GitHub replicas with pglite
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/server-rust/actual-folder-client.mjs --replicas --github-replicas --database pglite --report .qa/rust-server/actual-replica-product-pglite.json
      - name: Actual browser local Git and managed GitHub replicas with bundled-postgres
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/server-rust/actual-folder-client.mjs --replicas --github-replicas --database bundled-postgres --report .qa/rust-server/actual-replica-product-bundled-postgres.json

      - name: Worker control with external PostgreSQL and real authentication lock faults
        run: node --import tsx scripts/server-rust/worker-compatibility.mjs --database postgres --report .qa/rust-server/worker-external-http.json
      - name: Actual worker command admission and incoming envelopes with PGlite
        run: node --import tsx scripts/server-rust/worker-ingress-compatibility.mjs --report .qa/rust-server/worker-ingress-pglite.json
      - name: Actual worker command admission and incoming envelopes with private PostgreSQL

      - name: Encrypted policy HTTP and Live events with external PostgreSQL
        run: node scripts/server-rust/policy-http-compatibility.mjs --database postgres --report .qa/rust-server/policy-http-external.json
      - name: Policy HTTP method routing with native PGlite
        run: node scripts/server-rust/policy-routing-compatibility.mjs --report .qa/rust-server/policy-routing-pglite.json
      - name: Policy HTTP method routing with private PostgreSQL
        run: node scripts/server-rust/policy-routing-compatibility.mjs --database bundled-postgres --report .qa/rust-server/policy-routing-bundled.json
      - name: Policy HTTP method routing with external PostgreSQL
        run: node scripts/server-rust/policy-routing-compatibility.mjs --database postgres --report .qa/rust-server/policy-routing-external.json
      - name: Retained policy writes through Node Rust Node reversal
        run: node scripts/server-rust/policy-retained-compatibility.mjs --report .qa/rust-server/policy-retained.json
      - name: Full project mapping with native PGlite
        run: node --import tsx scripts/server-rust/project-repository-compatibility.mjs --report .qa/rust-server/live-projects-pglite.json
      - name: Full project mapping with private PostgreSQL
        run: node --import tsx scripts/server-rust/project-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/live-projects-bundled.json
      - name: Full project mapping with external PostgreSQL
        run: node --import tsx scripts/server-rust/project-repository-compatibility.mjs --database postgres --report .qa/rust-server/live-projects-external.json

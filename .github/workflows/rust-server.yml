      - name: Actual Chromium APIs, Live client and unchanged worker components with PGlite
        run: node --import tsx scripts/server-rust/worker-client-compatibility.mjs --report .qa/rust-server/worker-client-pglite.json
      - name: Actual Chromium APIs, Live client and unchanged worker components with private PostgreSQL
        run: node --import tsx scripts/server-rust/worker-client-compatibility.mjs --database bundled-postgres --report .qa/rust-server/worker-client-bundled.json

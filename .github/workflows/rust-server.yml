      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/@zavora-ai__computer-use-mcp@7.0.0.patch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # The Windows GNU build plus actual Node/Rust storage and transport suites
    # exceeded 60 minutes in run 40473447456 without a failing test.
    timeout-minutes: 120
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - name: Windows native PGlite toolchain
        if: runner.os == 'Windows'
        id: mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-openssl
      - name: Windows Rust target and PostgreSQL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CANTRIP_MINGW_BIN: ${{ steps.mingw.outputs.msys2-location }}\mingw64\bin
        run: |
          rustup target add x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" >> $env:GITHUB_ENV
          "$env:CANTRIP_MINGW_BIN" >> $env:GITHUB_PATH
          "CANTRIP_TEST_POSTGRES_BIN_DIR=$env:PGBIN" >> $env:GITHUB_ENV
      - name: Linux PostgreSQL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libssl-dev
          echo "CANTRIP_TEST_POSTGRES_BIN_DIR=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: macOS PostgreSQL
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "CANTRIP_TEST_POSTGRES_BIN_DIR=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cantrip/version --filter @cantrip/logging --filter @cantrip/protocol --filter @cantrip/crypto --filter @cantrip/glitch -r build
      - name: Shared resource cleanup SQL matches the actual TypeScript helpers
        run: node --import tsx scripts/server-rust/resource-layout-query-manifest.mjs --check
      - name: Browser query statements match the actual TypeScript repository
        run: node --import tsx scripts/server-rust/browser-query-manifest.mjs --check
      - name: Shared desktop verifier retains its owning crate's formatting
        run: rustfmt --edition 2021 --check cantrip_app/src-tauri/src/direct_probe_connection.rs
      - name: Terminal HTTP and ordered Live notifications with native PGlite
        run: node --import tsx scripts/server-rust/terminal-http-compatibility.mjs --report .qa/rust-server/terminal-http-pglite.json
      - name: Terminal HTTP and ordered Live notifications with private PostgreSQL
        run: node --import tsx scripts/server-rust/terminal-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/terminal-http-bundled.json
      - name: Terminal HTTP and disconnected creation through shutdown with external PostgreSQL
        run: node --import tsx scripts/server-rust/terminal-http-compatibility.mjs --database postgres --report .qa/rust-server/terminal-http-external.json
      - name: Build the production worker used by browser integration
        run: pnpm --filter @cantrip/worker build
      - name: Browser state refresh retains concurrent updates and attachment recipients
        run: pnpm --filter @cantrip/worker exec vitest run test/browser-state-publication.test.ts --maxWorkers=1
      - name: Embedded desktop backend retains worker signal ownership
        run: pnpm --filter @cantrip/worker exec vitest run test/desktop-automation-lifecycle.test.ts --maxWorkers=1
      - name: Browser for unchanged client and worker control integration
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Allow the downloaded Chromium to use its namespace sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: node scripts/server-rust/linux-chromium-sandbox.mjs
      - name: Actual browser, server and full worker catalog flow with PGlite
        run: node --import tsx scripts/server-rust/actual-worker-client.mjs --report .qa/rust-server/actual-worker-client-pglite.json
      - name: Actual browser, server and full worker catalog flow with private PostgreSQL
        run: node --import tsx scripts/server-rust/actual-worker-client.mjs --database bundled-postgres --report .qa/rust-server/actual-worker-client-bundled.json
      - name: Actual browser, server and full worker catalog flow with external PostgreSQL
        run: node --import tsx scripts/server-rust/actual-worker-client.mjs --database postgres --report .qa/rust-server/actual-worker-client-external.json
      - name: Execution target descriptor composition and wire ordering
        run: node scripts/server-rust/project-target-catalog-compatibility.mjs --report .qa/rust-server/project-target-catalog.json
      - name: Project placement selection with native PGlite
        run: node scripts/server-rust/project-placement-compatibility.mjs --report .qa/rust-server/project-placement-pglite.json
      - name: Project placement selection with private PostgreSQL
        run: node scripts/server-rust/project-placement-compatibility.mjs --database bundled-postgres --report .qa/rust-server/project-placement-bundled.json
      - name: Project placement selection with external PostgreSQL
        run: node scripts/server-rust/project-placement-compatibility.mjs --database postgres --report .qa/rust-server/project-placement-external.json
      - name: Protected execution target repositories with native PGlite
        run: node scripts/server-rust/project-target-repository-compatibility.mjs --report .qa/rust-server/project-target-repository-pglite.json
      - name: Protected execution target repositories with private PostgreSQL
        run: node scripts/server-rust/project-target-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/project-target-repository-bundled.json
      - name: Protected execution target repositories with external PostgreSQL
        run: node scripts/server-rust/project-target-repository-compatibility.mjs --database postgres --report .qa/rust-server/project-target-repository-external.json
      - name: Project HTTP contracts and actual worker presence with native PGlite
        run: node --import tsx scripts/server-rust/project-http-compatibility.mjs --report .qa/rust-server/project-http-pglite.json
      - name: Project HTTP contracts and actual worker presence with private PostgreSQL
        run: node --import tsx scripts/server-rust/project-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/project-http-bundled.json
      - name: Project HTTP contracts and actual worker presence with external PostgreSQL
        run: node --import tsx scripts/server-rust/project-http-compatibility.mjs --database postgres --report .qa/rust-server/project-http-external.json
      - name: Managed-folder durable repository compatibility with native PGlite
        run: node --import tsx scripts/server-rust/folder-repository-compatibility.mjs --report .qa/rust-server/folder-repository-pglite.json
      - name: Managed-folder durable repository compatibility with private PostgreSQL
        run: node --import tsx scripts/server-rust/folder-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/folder-repository-bundled.json
      - name: Managed-folder durable repository compatibility with external PostgreSQL
        run: node --import tsx scripts/server-rust/folder-repository-compatibility.mjs --database postgres --report .qa/rust-server/folder-repository-external.json
      - name: Managed-folder HTTP, Live, encrypted routing and shutdown with native PGlite
        run: node --import tsx scripts/server-rust/folder-http-compatibility.mjs --report .qa/rust-server/folder-http-pglite.json
      - name: Managed-folder HTTP, Live, encrypted routing and shutdown with private PostgreSQL
        run: node --import tsx scripts/server-rust/folder-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/folder-http-bundled.json
      - name: Managed-folder HTTP, Live, encrypted routing and shutdown with external PostgreSQL
        run: node --import tsx scripts/server-rust/folder-http-compatibility.mjs --database postgres --report .qa/rust-server/folder-http-external.json
      - name: Browser repositories, layouts and rollback with native PGlite
        run: node --import tsx scripts/server-rust/browser-repository-compatibility.mjs --report .qa/rust-server/browser-repository-pglite.json
      - name: Browser repositories, layouts and rollback with private PostgreSQL
        run: node --import tsx scripts/server-rust/browser-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/browser-repository-bundled.json
      - name: Browser repositories and observed write races with external PostgreSQL
        run: node --import tsx scripts/server-rust/browser-repository-compatibility.mjs --database postgres --report .qa/rust-server/browser-repository-external.json
      - name: Browser HTTP, saved state and managed tunnel cleanup with native PGlite
        run: node --import tsx scripts/server-rust/browser-http-compatibility.mjs --report .qa/rust-server/browser-http-pglite.json
      - name: Browser HTTP, saved state and managed tunnel cleanup with private PostgreSQL
        run: node --import tsx scripts/server-rust/browser-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/browser-http-bundled.json
      - name: Browser HTTP, saved state and managed tunnel cleanup with external PostgreSQL
        run: node --import tsx scripts/server-rust/browser-http-compatibility.mjs --database postgres --report .qa/rust-server/browser-http-external.json
      - name: Browser service discovery, worker deadlines and fleet bounds with native PGlite
        run: node --import tsx scripts/server-rust/browser-discovery-http-compatibility.mjs --report .qa/rust-server/browser-discovery-http-pglite.json
      - name: Browser service discovery, worker deadlines and fleet bounds with private PostgreSQL
        run: node --import tsx scripts/server-rust/browser-discovery-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/browser-discovery-http-bundled.json
      - name: Browser service discovery, worker deadlines and fleet bounds with external PostgreSQL
        run: node --import tsx scripts/server-rust/browser-discovery-http-compatibility.mjs --database postgres --report .qa/rust-server/browser-discovery-http-external.json
      - name: Project-share repository query drift
        run: node --import tsx scripts/server-rust/project-share-query-manifest.mjs --check
      - name: Project-share reference broker and grant revocation
        run: pnpm --filter @cantrip/server exec vitest run test/project-share-tunnel.test.ts
      - name: Protected project and chat shares with native PGlite
        run: node --import tsx scripts/server-rust/project-share-http-compatibility.mjs --report .qa/rust-server/project-share-http-pglite.json
      - name: Protected project and chat shares with private PostgreSQL
        run: node --import tsx scripts/server-rust/project-share-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/project-share-http-bundled.json
      - name: Protected project and chat shares with external PostgreSQL
        run: node --import tsx scripts/server-rust/project-share-http-compatibility.mjs --database postgres --report .qa/rust-server/project-share-http-external.json
      - name: Admitted share registration survives caller disconnect and shutdown
        run: node --import tsx scripts/server-rust/project-share-shutdown.mjs --report .qa/rust-server/project-share-shutdown.json
      - name: Actual browser folders, encrypted PTYs and WorkerLink observations with native PGlite
        run: node --import tsx scripts/server-rust/actual-folder-client.mjs --terminals --worker-links --terminal-direct --surfaces --tunnels --project-shares --report .qa/rust-server/actual-folder-client-pglite.json
      - name: Actual browser folders, encrypted PTYs and WorkerLink observations with private PostgreSQL
        run: node --import tsx scripts/server-rust/actual-folder-client.mjs --terminals --worker-links --terminal-direct --surfaces --tunnels --database bundled-postgres --project-shares --report .qa/rust-server/actual-folder-client-bundled.json
      - name: Actual browser folders, encrypted PTYs and WorkerLink observations with external PostgreSQL
        run: node --import tsx scripts/server-rust/actual-folder-client.mjs --terminals --worker-links --terminal-direct --surfaces --tunnels --database postgres --project-shares --report .qa/rust-server/actual-folder-client-external.json
      - name: Terminal-service repository compatibility with native PGlite
        run: node --import tsx scripts/server-rust/maintenance-repository-compatibility.mjs --report .qa/rust-server/maintenance-repository-pglite.json
      - name: Terminal-service repository compatibility with private PostgreSQL
        run: node --import tsx scripts/server-rust/maintenance-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/maintenance-repository-bundled.json
      - name: Terminal-service repository compatibility with external PostgreSQL
        run: node --import tsx scripts/server-rust/maintenance-repository-compatibility.mjs --database postgres --report .qa/rust-server/maintenance-repository-external.json
      - name: Worker encryption refresh and terminal Live with native PGlite
        run: node --import tsx scripts/server-rust/maintenance-http-compatibility.mjs --report .qa/rust-server/maintenance-http-pglite.json
      - name: Worker encryption refresh and terminal Live with private PostgreSQL
        run: node --import tsx scripts/server-rust/maintenance-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/maintenance-http-bundled.json
      - name: Worker encryption refresh, fail-fast siblings and shutdown with external PostgreSQL
        run: node --import tsx scripts/server-rust/maintenance-http-compatibility.mjs --database postgres --report .qa/rust-server/maintenance-http-external.json
      - name: Terminal resources and transactional layouts with native PGlite
        run: node --import tsx scripts/server-rust/terminal-repository-compatibility.mjs --report .qa/rust-server/terminal-repository-pglite.json
      - name: Terminal resources and transactional layouts with private PostgreSQL
        run: node --import tsx scripts/server-rust/terminal-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/terminal-repository-bundled.json
      - name: Terminal resources and transactional layouts with external PostgreSQL
        run: node --import tsx scripts/server-rust/terminal-repository-compatibility.mjs --database postgres --report .qa/rust-server/terminal-repository-external.json
      - name: Managed console routing and canonical bindings with native PGlite
        run: node --import tsx scripts/server-rust/chat-runtime-repository-compatibility.mjs --report .qa/rust-server/chat-runtime-pglite.json
      - name: Managed console routing and canonical bindings with private PostgreSQL
        run: node --import tsx scripts/server-rust/chat-runtime-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/chat-runtime-bundled.json
      - name: Managed console routing and canonical bindings with external PostgreSQL
        run: node --import tsx scripts/server-rust/chat-runtime-repository-compatibility.mjs --database postgres --report .qa/rust-server/chat-runtime-external.json
      - name: WorkerLink coordinator authority and acknowledgment races
        run: node --import tsx scripts/server-rust/worker-link-coordinator-compatibility.mjs --report .qa/rust-server/worker-link-coordinator.json
      - name: Remote-surface canonical context, status and browser backfill with native PGlite
        run: node --import tsx scripts/server-rust/remote-surface-repository-compatibility.mjs --report .qa/rust-server/remote-surface-repository-pglite.json
      - name: Remote-surface canonical context, status and browser backfill with private PostgreSQL
        run: node --import tsx scripts/server-rust/remote-surface-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/remote-surface-repository-bundled.json
      - name: Remote-surface canonical context, status and browser backfill with external PostgreSQL
        run: node --import tsx scripts/server-rust/remote-surface-repository-compatibility.mjs --database postgres --report .qa/rust-server/remote-surface-repository-external.json
      - name: Direct attachment capability, lease and mutation races
        run: node --import tsx scripts/server-rust/direct-attachment-compatibility.mjs --report .qa/rust-server/direct-attachment-coordinator.json
      - name: Tunnel catalog, managed ownership, attachments and direct leases with native PGlite
        run: node --import tsx scripts/server-rust/tunnel-repository-compatibility.mjs --report .qa/rust-server/tunnel-repository-pglite.json
      - name: Tunnel catalog, managed ownership, attachments and direct leases with private PostgreSQL
        run: node --import tsx scripts/server-rust/tunnel-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/tunnel-repository-bundled.json
      - name: Tunnel catalog, managed ownership and actual write races with external PostgreSQL
        run: node --import tsx scripts/server-rust/tunnel-repository-compatibility.mjs --database postgres --report .qa/rust-server/tunnel-repository-external.json
      - name: Tunnel catalog HTTP, authorization and Live with native PGlite
        run: node --import tsx scripts/server-rust/tunnel-http-compatibility.mjs --report .qa/rust-server/tunnel-http-pglite.json
      - name: Tunnel catalog HTTP, authorization and Live with private PostgreSQL
        run: node --import tsx scripts/server-rust/tunnel-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/tunnel-http-bundled.json
      - name: Tunnel catalog HTTP, authorization and Live with external PostgreSQL
        run: node --import tsx scripts/server-rust/tunnel-http-compatibility.mjs --database postgres --report .qa/rust-server/tunnel-http-external.json
      - name: Reference tunnel control plane, runtime and stream broker
        run: pnpm --filter @cantrip/server exec vitest run test/tunnel-control-plane.test.ts test/tunnel-runtime.test.ts test/tunnel-runtime-shutdown.test.ts test/tunnel-stream-broker.test.ts --maxWorkers=1
      - name: Raw tunnel upgrade headers and malformed handshakes with native PGlite
        run: node --import tsx scripts/server-rust/tunnel-handshake-compatibility.mjs --report .qa/rust-server/tunnel-handshakes-pglite.json
      - name: Raw tunnel upgrade headers and malformed handshakes with private PostgreSQL
        run: node --import tsx scripts/server-rust/tunnel-handshake-compatibility.mjs --database bundled-postgres --report .qa/rust-server/tunnel-handshakes-bundled.json
      - name: Raw tunnel upgrade headers and malformed handshakes with external PostgreSQL
        run: node --import tsx scripts/server-rust/tunnel-handshake-compatibility.mjs --database postgres --report .qa/rust-server/tunnel-handshakes-external.json
      - name: Legacy tunnel attachments, direct activation, heartbeat and opaque sockets with native PGlite
        run: node --import tsx scripts/server-rust/tunnel-attachment-compatibility.mjs --report .qa/rust-server/tunnel-attachments-http-pglite.json
      - name: Legacy tunnel attachments, direct activation, heartbeat and opaque sockets with private PostgreSQL
        run: node --import tsx scripts/server-rust/tunnel-attachment-compatibility.mjs --database bundled-postgres --report .qa/rust-server/tunnel-attachments-http-bundled.json
      - name: Legacy tunnel attachment activation, expiry and disconnect lock races with external PostgreSQL
        run: node --import tsx scripts/server-rust/tunnel-attachment-compatibility.mjs --database postgres --report .qa/rust-server/tunnel-attachments-http-external.json
      - name: Legacy tunnel initialization and active-worker revocation with native PGlite
        run: node --import tsx scripts/server-rust/tunnel-attachment-compatibility.mjs --runtime-faults --report .qa/rust-server/tunnel-runtime-faults-pglite.json
      - name: Legacy tunnel initialization and active-worker revocation with private PostgreSQL
        run: node --import tsx scripts/server-rust/tunnel-attachment-compatibility.mjs --runtime-faults --database bundled-postgres --report .qa/rust-server/tunnel-runtime-faults-bundled.json
      - name: Legacy tunnel initialization during blocked authorization and worker revocation with external PostgreSQL
        run: node --import tsx scripts/server-rust/tunnel-attachment-compatibility.mjs --runtime-faults --database postgres --report .qa/rust-server/tunnel-runtime-faults-external.json
      - name: Legacy tunnel shutdown retains blocked activation and fenced cleanup
        run: node --import tsx scripts/server-rust/tunnel-attachment-compatibility.mjs --runtime-shutdown --database postgres --report .qa/rust-server/tunnel-runtime-shutdown-activation.json
      - name: Legacy tunnel shutdown retains blocked authorization and usage recording

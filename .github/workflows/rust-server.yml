          components: rustfmt, clippy
      - name: Windows native PGlite toolchain
        if: runner.os == 'Windows'
        id: mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-openssl
      - name: Windows Rust target and PostgreSQL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CANTRIP_MINGW_BIN: ${{ steps.mingw.outputs.msys2-location }}\mingw64\bin
        run: |
          rustup target add x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" >> $env:GITHUB_ENV
          "$env:CANTRIP_MINGW_BIN" >> $env:GITHUB_PATH
          "CANTRIP_TEST_POSTGRES_BIN_DIR=$env:PGBIN" >> $env:GITHUB_ENV
      - name: Linux PostgreSQL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libssl-dev
          echo "CANTRIP_TEST_POSTGRES_BIN_DIR=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: macOS PostgreSQL
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "CANTRIP_TEST_POSTGRES_BIN_DIR=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cantrip/version --filter @cantrip/logging --filter @cantrip/protocol --filter @cantrip/crypto --filter @cantrip/glitch -r build
      - name: Create conversion evidence directory
        run: |
          node -e "require('node:fs').mkdirSync('.qa/rust-server', { recursive: true })"
      - name: Build the production worker used by conversion integration
        run: pnpm --filter @cantrip/worker build
      - name: Browser for actual encrypted conversion clients
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Allow the downloaded Chromium to use its namespace sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: node scripts/server-rust/linux-chromium-sandbox.mjs
      - name: Conversion durable admission, fencing and rollback with pglite
        run: node --import tsx scripts/server-rust/conversion-repository-compatibility.mjs --database pglite --report .qa/rust-server/conversion-repository-compatibility-pglite.json
      - name: Conversion HTTP, worker, Live, capacity and recovery with pglite
        run: node --import tsx scripts/server-rust/conversion-http-compatibility.mjs --database pglite --lifecycle --report .qa/rust-server/conversion-http-compatibility-pglite.json
      - name: Conversion production lease renewal and expiry with pglite
        run: node --import tsx scripts/server-rust/conversion-http-compatibility.mjs --database pglite --profile none --leases --report .qa/rust-server/conversion-real-leases-pglite.json
      - name: Pending observation command shutdown and conversion recovery with pglite
        run: node --import tsx scripts/server-rust/conversion-http-compatibility.mjs --database pglite --profile none --lifecycle --observation-shutdown --report .qa/rust-server/conversion-observation-shutdown-pglite.json
      - name: Actual encrypted browser and full worker GitHub conversion with pglite

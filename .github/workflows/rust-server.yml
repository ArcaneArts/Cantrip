name: Rust server replacement

on:
  pull_request:
    paths:
      - cantrip_server_rs/**
      - cantrip_server/drizzle/**
      - cantrip_server/src/config.ts
      - cantrip_server/src/auth/**
      - cantrip_server/src/app/routes/auth-sessions.ts
      - cantrip_server/src/app/routes/system-status.ts
      - cantrip_server/src/app/routes/account-security.ts
      - cantrip_server/src/app/routes/account-live-traffic.ts
      - cantrip_server/src/account-usage/**
      - cantrip_server/src/db/account-resource-usage.ts
      - cantrip_server/src/db/policies.ts
      - cantrip_server/src/db/repository/settings.ts
      - cantrip_server/src/db/repository.ts
      - cantrip_server/src/db/repository/provider*.ts
      - cantrip_server/src/db/repository/telemetry.ts
      - cantrip_server/src/db/repository-facade-identity-model.ts
      - cantrip_server/src/db/schema.ts
      - cantrip_server/src/db/repository/model*.ts
      - cantrip_server/src/models/**
      - cantrip_server/src/app/runtime/settings-routes.ts
      - cantrip_server/src/app/runtime/application-service-foundation.ts
      - cantrip_server/src/app/routes/provider-account-auth.ts
      - cantrip_server/src/app/routes/internal-provider-credentials.ts
      - cantrip_server/src/operations/relay-quotas.ts
      - cantrip_server/src/security/abuse-limits.ts
      - cantrip_server/src/security/json-bytes.ts
      - cantrip_server/test/json-bytes.test.ts
      - cantrip_server/test/abuse-limits.test.ts
      - cantrip_server/src/policies/**
      - cantrip_server/src/app/routes/policies.ts
      - policy_templates/**
      - cantrip_server/src/app/shared/constants.ts
      - cantrip_server/src/app/routes/internal-worker*.ts
      - cantrip_server/src/app/routes/worker-*.ts
      - cantrip_server/src/workers/**
      - cantrip_server/src/db/repository/workers.ts
      - cantrip_server/src/db/repository/projects.ts
      - cantrip_server/src/db/repository/chat-runtime-context.ts
      - cantrip_server/src/app/routes/live.ts
      - cantrip_server/src/app/runtime/session-socket-runtime.ts
      - cantrip_server/src/app/runtime/live-infrastructure-runtime.ts
      - cantrip_server/src/live/**
      - cantrip_server/test/worker-authentication-shutdown.test.ts
      - cantrip_server/test/worker-notification-connect-order.test.ts
      - cantrip_server/test/buffered-worker-socket.test.ts
      - cantrip_server/test/websocket-subprotocol.test.ts
      - cantrip_worker/**
      - cantrip_cli/**
      - cantrip_app/src/lib/api/workers.ts
      - cantrip_app/src/lib/api/account.ts
      - cantrip_app/src/lib/api/models.ts
      - cantrip_app/src/lib/protected-secrets.ts
      - cantrip_app/src/lib/api-client.ts
      - cantrip_app/src/lib/app-live-client.ts
      - cantrip_server/src/app/http/**
      - cantrip_server/src/db/repository/accounts.ts
      - cantrip_server/src/db/encryption-registry.ts
      - packages/protocol/**
      - packages/crypto/**
      - scripts/server-rust/**
      - scripts/cantrip-cli/**
      - scripts/version.mjs
      - version.json
      - package.json
      - .github/workflows/rust-server.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/@zavora-ai__computer-use-mcp@7.0.0.patch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # The Windows GNU build plus actual Node/Rust storage and transport suites
    # exceeded 60 minutes in run 40473447456 without a failing test.
    timeout-minutes: 120
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - name: Windows native PGlite toolchain
        if: runner.os == 'Windows'
        id: mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-openssl
      - name: Windows Rust target and PostgreSQL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CANTRIP_MINGW_BIN: ${{ steps.mingw.outputs.msys2-location }}\mingw64\bin
        run: |
          rustup target add x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" >> $env:GITHUB_ENV
          "$env:CANTRIP_MINGW_BIN" >> $env:GITHUB_PATH
          "CANTRIP_TEST_POSTGRES_BIN_DIR=$env:PGBIN" >> $env:GITHUB_ENV
      - name: Linux PostgreSQL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libssl-dev
          echo "CANTRIP_TEST_POSTGRES_BIN_DIR=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: macOS PostgreSQL
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "CANTRIP_TEST_POSTGRES_BIN_DIR=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cantrip/version --filter @cantrip/logging --filter @cantrip/protocol --filter @cantrip/crypto --filter @cantrip/glitch -r build
      - name: Build the production worker used by browser integration
        run: pnpm --filter @cantrip/worker build
      - name: Embedded desktop backend retains worker signal ownership
        run: pnpm --filter @cantrip/worker exec vitest run test/desktop-automation-lifecycle.test.ts --maxWorkers=1
      - name: Browser for unchanged client and worker control integration
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Actual browser, server and full worker catalog flow with PGlite
        run: node --import tsx scripts/server-rust/actual-worker-client.mjs --report .qa/rust-server/actual-worker-client-pglite.json
      - name: Actual browser, server and full worker catalog flow with private PostgreSQL
        run: node --import tsx scripts/server-rust/actual-worker-client.mjs --database bundled-postgres --report .qa/rust-server/actual-worker-client-bundled.json
      - name: Actual browser, server and full worker catalog flow with external PostgreSQL
        run: node --import tsx scripts/server-rust/actual-worker-client.mjs --database postgres --report .qa/rust-server/actual-worker-client-external.json
      - name: Reference worker authentication shutdown and socket ordering
        # Each integration file initializes PGlite's WASM runtime and full SQL
        # schema. Avoid competing cold initializations on the hosted runners.
        run: pnpm --filter @cantrip/server exec vitest run test/worker-authentication-shutdown.test.ts test/worker-notification-connect-order.test.ts test/buffered-worker-socket.test.ts test/websocket-subprotocol.test.ts test/json-bytes.test.ts test/abuse-limits.test.ts --maxWorkers=1
      - name: Shared message decoding isolates validator exceptions
        run: pnpm --filter @cantrip/protocol exec vitest run src/json-message.test.ts
      - name: Built-in provider data matches the actual reference service
        run: node --import tsx scripts/server-rust/zai-catalog-data.mjs --check
      - run: cargo fmt --manifest-path cantrip_server_rs/Cargo.toml -- --check
      - run: node scripts/server-rust/cargo.mjs clippy --all-targets -- -D warnings
      - name: Configuration parity, existing schema, all storage modes and restart
        run: node scripts/server-rust/cargo.mjs test -- --nocapture
      - name: Node and Rust over real HTTP connections
        run: node scripts/server-rust/compatibility.mjs --report .qa/rust-server/foundation-http.json
      - name: PostgreSQL TLS policy and unrelated HTTP requests under a real relation lock
        run: node scripts/server-rust/postgres-connections.mjs --report .qa/rust-server/postgres-connections.json
      - name: Private PostgreSQL ownership, abrupt server death and retained restart
        run: node scripts/server-rust/postgres-lifecycle.mjs --report .qa/rust-server/postgres-lifecycle.json
      - name: Actual publication cursor accounting and rejection controls
        run: node --import tsx scripts/server-rust/live-cursor-contract.mjs --report .qa/rust-server/json-cursor-contract.json
      - name: Deep and malformed JSON with native PGlite
        run: node --import tsx scripts/server-rust/json-compatibility.mjs --report .qa/rust-server/json-pglite-http.json
      - name: Deep and malformed JSON with private PostgreSQL
        run: node --import tsx scripts/server-rust/json-compatibility.mjs --database bundled-postgres --report .qa/rust-server/json-bundled-http.json
      - name: Deep and malformed JSON with external PostgreSQL
        run: node --import tsx scripts/server-rust/json-compatibility.mjs --database postgres --report .qa/rust-server/json-external-http.json
      - name: Actual Node and Rust Live hub protocol, replay and control oracle
        run: node --import tsx scripts/server-rust/live-hub-oracle.mjs --report .qa/rust-server/live-hub-oracle.json
      - name: Account usage repositories with native PGlite
        run: node --import tsx scripts/server-rust/usage-repository-compatibility.mjs --report .qa/rust-server/usage-repository-pglite.json
      - name: Account usage repositories with private PostgreSQL
        run: node --import tsx scripts/server-rust/usage-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/usage-repository-bundled.json
      - name: Account usage repositories with external PostgreSQL
        run: node --import tsx scripts/server-rust/usage-repository-compatibility.mjs --database postgres --report .qa/rust-server/usage-repository-external.json
      - name: Usage HTTP payloads and shutdown persistence with native PGlite
        run: node --import tsx scripts/server-rust/usage-http-compatibility.mjs --report .qa/rust-server/usage-http-pglite.json
      - name: Usage HTTP payloads and shutdown persistence with private PostgreSQL
        run: node --import tsx scripts/server-rust/usage-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/usage-http-bundled.json
      - name: Usage HTTP payloads and shutdown persistence with external PostgreSQL
        run: node --import tsx scripts/server-rust/usage-http-compatibility.mjs --database postgres --report .qa/rust-server/usage-http-external.json
      - name: Usage socket accounting and observer feedback with native PGlite
        run: node --import tsx scripts/server-rust/usage-socket-compatibility.mjs --report .qa/rust-server/usage-sockets-pglite.json
      - name: Usage socket accounting and observer feedback with private PostgreSQL
        run: node --import tsx scripts/server-rust/usage-socket-compatibility.mjs --database bundled-postgres --report .qa/rust-server/usage-sockets-bundled.json
      - name: Usage socket accounting and observer feedback with external PostgreSQL
        run: node --import tsx scripts/server-rust/usage-socket-compatibility.mjs --database postgres --report .qa/rust-server/usage-sockets-external.json
      - name: Retained account usage and tenant isolation with native PGlite
        run: node --import tsx scripts/server-rust/usage-account-compatibility.mjs --report .qa/rust-server/usage-accounts-pglite.json
      - name: Retained account usage and tenant isolation with private PostgreSQL
        run: node --import tsx scripts/server-rust/usage-account-compatibility.mjs --database bundled-postgres --report .qa/rust-server/usage-accounts-bundled.json
      - name: Retained account usage and tenant isolation with external PostgreSQL
        run: node --import tsx scripts/server-rust/usage-account-compatibility.mjs --database postgres --report .qa/rust-server/usage-accounts-external.json
      - name: Settings and provider repositories with native PGlite
        run: node scripts/server-rust/settings-repository-compatibility.mjs --report .qa/rust-server/settings-repository-pglite.json
      - name: Settings and provider repositories with private PostgreSQL
        run: node scripts/server-rust/settings-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/settings-repository-bundled.json
      - name: Settings and provider repositories with external PostgreSQL
        run: node scripts/server-rust/settings-repository-compatibility.mjs --database postgres --report .qa/rust-server/settings-repository-external.json
      - name: Telemetry analytics, exports and rollback with native PGlite
        run: node scripts/server-rust/telemetry-repository-compatibility.mjs --report .qa/rust-server/telemetry-repository-pglite.json
      - name: Telemetry analytics, exports and rollback with private PostgreSQL
        run: node scripts/server-rust/telemetry-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/telemetry-repository-bundled.json
      - name: Telemetry analytics, exports and rollback with external PostgreSQL
        run: node scripts/server-rust/telemetry-repository-compatibility.mjs --database postgres --report .qa/rust-server/telemetry-repository-external.json
      - name: Telemetry HTTP, privacy and restart with native PGlite
        run: node scripts/server-rust/telemetry-http-compatibility.mjs --report .qa/rust-server/telemetry-http-pglite.json
      - name: Telemetry HTTP, privacy and restart with private PostgreSQL
        run: node scripts/server-rust/telemetry-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/telemetry-http-bundled.json
      - name: Telemetry HTTP, privacy and admitted deletion shutdown with external PostgreSQL
        run: node scripts/server-rust/telemetry-http-compatibility.mjs --database postgres --report .qa/rust-server/telemetry-http-external.json
      - name: Public OpenRouter HTTP cache, errors and actual deadlines
        run: node --import tsx scripts/server-rust/openrouter-http-compatibility.mjs --timeouts --report .qa/rust-server/openrouter-public-http.json
      - name: Settings HTTP and worker effects with native PGlite
        run: node scripts/server-rust/settings-http-compatibility.mjs --report .qa/rust-server/settings-http-pglite.json
      - name: Settings HTTP and worker effects with private PostgreSQL
        run: node scripts/server-rust/settings-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/settings-http-bundled.json
      - name: Settings HTTP and worker effects with external PostgreSQL
        run: node scripts/server-rust/settings-http-compatibility.mjs --database postgres --report .qa/rust-server/settings-http-external.json
      - name: Worker provider credentials with native PGlite
        run: node scripts/server-rust/provider-credential-http-compatibility.mjs --report .qa/rust-server/provider-credential-http-pglite.json
      - name: Worker provider credentials with private PostgreSQL
        run: node scripts/server-rust/provider-credential-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/provider-credential-http-bundled.json
      - name: Worker provider credentials with external PostgreSQL
        run: node scripts/server-rust/provider-credential-http-compatibility.mjs --database postgres --report .qa/rust-server/provider-credential-http-external.json
      - name: Provider account HTTP, Live and shutdown with native PGlite
        run: node scripts/server-rust/provider-account-http-compatibility.mjs --report .qa/rust-server/provider-account-http-pglite.json
      - name: Provider account HTTP, Live and shutdown with private PostgreSQL
        run: node scripts/server-rust/provider-account-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/provider-account-http-bundled.json
      - name: Provider account HTTP, Live and shutdown with external PostgreSQL
        run: node scripts/server-rust/provider-account-http-compatibility.mjs --database postgres --report .qa/rust-server/provider-account-http-external.json
      - name: Provider catalog HTTP, cancellation and retained cache with native PGlite
        run: node scripts/server-rust/provider-catalog-http-compatibility.mjs --report .qa/rust-server/provider-catalog-http-pglite.json
      - name: Provider catalog HTTP, cancellation and retained cache with private PostgreSQL
        run: node scripts/server-rust/provider-catalog-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/provider-catalog-http-bundled.json
      - name: Provider catalog HTTP, cancellation and retained cache with external PostgreSQL
        run: node scripts/server-rust/provider-catalog-http-compatibility.mjs --database postgres --report .qa/rust-server/provider-catalog-http-external.json
      - name: Global settings and provider CRUD with native PGlite
        run: node scripts/server-rust/provider-management-http-compatibility.mjs --report .qa/rust-server/provider-management-http-pglite.json
      - name: Global settings and provider CRUD with private PostgreSQL
        run: node scripts/server-rust/provider-management-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/provider-management-http-bundled.json
      - name: Global settings and provider CRUD with external PostgreSQL
        run: node scripts/server-rust/provider-management-http-compatibility.mjs --database postgres --report .qa/rust-server/provider-management-http-external.json
      - name: Provider auth status, opaque capture and caller lifetime with native PGlite
        run: node scripts/server-rust/provider-auth-http-compatibility.mjs --report .qa/rust-server/provider-auth-http-pglite.json
      - name: Provider auth status, opaque capture and caller lifetime with private PostgreSQL
        run: node scripts/server-rust/provider-auth-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/provider-auth-http-bundled.json
      - name: Provider auth status, opaque capture and caller lifetime with external PostgreSQL
        run: node scripts/server-rust/provider-auth-http-compatibility.mjs --database postgres --report .qa/rust-server/provider-auth-http-external.json
      - name: Provider quota/reset HTTP and partial commits with native PGlite
        run: node scripts/server-rust/provider-quota-http-compatibility.mjs --report .qa/rust-server/provider-quota-http-pglite.json
      - name: Provider quota/reset HTTP and partial commits with private PostgreSQL
        run: node scripts/server-rust/provider-quota-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/provider-quota-http-bundled.json
      - name: Provider quota/reset HTTP and partial commits with external PostgreSQL
        run: node scripts/server-rust/provider-quota-http-compatibility.mjs --database postgres --report .qa/rust-server/provider-quota-http-external.json
      - name: Command quotas through HTTP and worker sockets with native PGlite
        run: node scripts/server-rust/worker-command-http-compatibility.mjs --report .qa/rust-server/command-http-pglite.json
      - name: Command quotas through HTTP and worker sockets with private PostgreSQL
        run: node scripts/server-rust/worker-command-http-compatibility.mjs --database bundled-postgres --report .qa/rust-server/command-http-bundled.json
      - name: Command quotas through HTTP and worker sockets with external PostgreSQL
        run: node scripts/server-rust/worker-command-http-compatibility.mjs --database postgres --report .qa/rust-server/command-http-external.json
      - name: Native PGlite host environment compatibility
        run: node scripts/server-rust/pglite-environment-compatibility.mjs --report .qa/rust-server/pglite-host-environment.json
      # Policy scope rows are seeded fixtures; these suites do not claim
      # project/workspace CRUD or the unported chat execution runtime.
      - name: Policy persistence and rollback with native PGlite
        run: node scripts/server-rust/policy-repository-compatibility.mjs --report .qa/rust-server/policy-repository-pglite.json
      - name: Policy persistence and rollback with private PostgreSQL
        run: node scripts/server-rust/policy-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/policy-repository-bundled.json
      - name: Policy persistence and rollback with external PostgreSQL
        run: node scripts/server-rust/policy-repository-compatibility.mjs --database postgres --report .qa/rust-server/policy-repository-external.json

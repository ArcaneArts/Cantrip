name: Rust server replacement

on:
  pull_request:
    paths:
      - cantrip_server_rs/**
      - cantrip_server/drizzle/**
      - cantrip_server/src/config.ts
      - cantrip_server/src/auth/**
      - cantrip_server/src/app/routes/auth-sessions.ts
      - cantrip_server/src/app/routes/system-status.ts
      - cantrip_server/src/app/routes/account-security.ts
      - cantrip_server/src/app/routes/internal-worker*.ts
      - cantrip_server/src/app/routes/worker-*.ts
      - cantrip_server/src/workers/**
      - cantrip_server/src/db/repository/workers.ts
      - cantrip_server/src/db/repository/projects.ts
      - cantrip_server/src/db/repository/chat-runtime-context.ts
      - cantrip_server/src/app/routes/live.ts
      - cantrip_server/src/app/runtime/session-socket-runtime.ts
      - cantrip_server/src/app/runtime/live-infrastructure-runtime.ts
      - cantrip_server/src/live/**
      - cantrip_server/test/worker-authentication-shutdown.test.ts
      - cantrip_server/test/worker-notification-connect-order.test.ts
      - cantrip_server/test/buffered-worker-socket.test.ts
      - cantrip_server/test/websocket-subprotocol.test.ts
      - cantrip_worker/src/transport.ts
      - cantrip_worker/src/enrollment.ts
      - cantrip_worker/src/heartbeat.ts
      - cantrip_worker/src/credential-store.ts
      - cantrip_app/src/lib/api/workers.ts
      - cantrip_app/src/lib/api/account.ts
      - cantrip_app/src/lib/api-client.ts
      - cantrip_app/src/lib/app-live-client.ts
      - cantrip_server/src/app/http/**
      - cantrip_server/src/db/repository/accounts.ts
      - cantrip_server/src/db/encryption-registry.ts
      - packages/protocol/**
      - packages/crypto/**
      - scripts/server-rust/**
      - scripts/version.mjs
      - version.json
      - package.json
      - .github/workflows/rust-server.yml
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - name: Windows native PGlite toolchain
        if: runner.os == 'Windows'
        id: mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-openssl
      - name: Windows Rust target and PostgreSQL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CANTRIP_MINGW_BIN: ${{ steps.mingw.outputs.msys2-location }}\mingw64\bin
        run: |
          rustup target add x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" >> $env:GITHUB_ENV
          "$env:CANTRIP_MINGW_BIN" >> $env:GITHUB_PATH
          "CANTRIP_TEST_POSTGRES_BIN_DIR=$env:PGBIN" >> $env:GITHUB_ENV
      - name: Linux PostgreSQL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libssl-dev
          echo "CANTRIP_TEST_POSTGRES_BIN_DIR=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: macOS PostgreSQL
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "CANTRIP_TEST_POSTGRES_BIN_DIR=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cantrip/version --filter @cantrip/logging --filter @cantrip/protocol --filter @cantrip/crypto --filter @cantrip/glitch -r build
      - name: Browser for unchanged client and worker control integration
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Reference worker authentication shutdown and socket ordering
        # Each integration file initializes PGlite's WASM runtime and full SQL
        # schema. Avoid competing cold initializations on the hosted runners.
        run: pnpm --filter @cantrip/server exec vitest run test/worker-authentication-shutdown.test.ts test/worker-notification-connect-order.test.ts test/buffered-worker-socket.test.ts test/websocket-subprotocol.test.ts --maxWorkers=1
      - run: cargo fmt --manifest-path cantrip_server_rs/Cargo.toml -- --check
      - run: node scripts/server-rust/cargo.mjs clippy --all-targets -- -D warnings
      - name: Configuration parity, existing schema, all storage modes and restart
        run: node scripts/server-rust/cargo.mjs test -- --nocapture
      - name: Node and Rust over real HTTP connections
        run: node scripts/server-rust/compatibility.mjs --report .qa/rust-server/foundation-http.json
      - name: PostgreSQL TLS policy and unrelated HTTP requests under a real relation lock
        run: node scripts/server-rust/postgres-connections.mjs --report .qa/rust-server/postgres-connections.json
      - name: Actual publication cursor accounting and rejection controls
        run: node --import tsx scripts/server-rust/live-cursor-contract.mjs --report .qa/rust-server/json-cursor-contract.json
      - name: Deep and malformed JSON with native PGlite
        run: node --import tsx scripts/server-rust/json-compatibility.mjs --report .qa/rust-server/json-pglite-http.json
      - name: Deep and malformed JSON with private PostgreSQL
        run: node --import tsx scripts/server-rust/json-compatibility.mjs --database bundled-postgres --report .qa/rust-server/json-bundled-http.json
      - name: Deep and malformed JSON with external PostgreSQL
        run: node --import tsx scripts/server-rust/json-compatibility.mjs --database postgres --report .qa/rust-server/json-external-http.json
      - name: Actual Node and Rust Live hub protocol, replay and control oracle
        run: node --import tsx scripts/server-rust/live-hub-oracle.mjs --report .qa/rust-server/live-hub-oracle.json
      - name: Full project mapping with native PGlite
        run: node --import tsx scripts/server-rust/project-repository-compatibility.mjs --report .qa/rust-server/live-projects-pglite.json
      - name: Full project mapping with private PostgreSQL
        run: node --import tsx scripts/server-rust/project-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/live-projects-bundled.json
      - name: Full project mapping with external PostgreSQL
        run: node --import tsx scripts/server-rust/project-repository-compatibility.mjs --database postgres --report .qa/rust-server/live-projects-external.json
      - name: Live scope and session authorization with native PGlite
        run: node --import tsx scripts/server-rust/live-repository-compatibility.mjs --report .qa/rust-server/live-scopes-pglite.json
      - name: Live scope and session authorization with private PostgreSQL
        run: node --import tsx scripts/server-rust/live-repository-compatibility.mjs --database bundled-postgres --report .qa/rust-server/live-scopes-bundled.json
      - name: Live scope and session authorization with external PostgreSQL
        run: node --import tsx scripts/server-rust/live-repository-compatibility.mjs --database postgres --report .qa/rust-server/live-scopes-external.json
      - name: Actual Live HTTP and WebSocket transport with native PGlite
        run: node --import tsx scripts/server-rust/live-compatibility.mjs --report .qa/rust-server/live-pglite-http.json
      - name: Actual Live HTTP and WebSocket transport with private PostgreSQL
        run: node --import tsx scripts/server-rust/live-compatibility.mjs --database bundled-postgres --report .qa/rust-server/live-bundled-http.json
      - name: Actual Live HTTP and WebSocket transport with external PostgreSQL
        run: node --import tsx scripts/server-rust/live-compatibility.mjs --database postgres --report .qa/rust-server/live-external-http.json
      - name: Authentication over real HTTP with native PGlite
        run: node --import tsx scripts/server-rust/auth-compatibility.mjs --report .qa/rust-server/auth-pglite-http.json
      - name: Authentication over real HTTP with private PostgreSQL
        run: node --import tsx scripts/server-rust/auth-compatibility.mjs --database bundled-postgres --report .qa/rust-server/auth-bundled-http.json
      - name: Authentication over external PostgreSQL and Node/Rust retained state
        run: node --import tsx scripts/server-rust/auth-compatibility.mjs --database postgres --report .qa/rust-server/auth-external-http.json
      - name: Encryption and account security with native PGlite
        run: node --import tsx scripts/server-rust/security-compatibility.mjs --report .qa/rust-server/security-pglite-http.json
      - name: Encryption and account security with private PostgreSQL
        run: node --import tsx scripts/server-rust/security-compatibility.mjs --database bundled-postgres --report .qa/rust-server/security-bundled-http.json
      - name: Encryption and account security with external PostgreSQL and post-write reversal
        run: node --import tsx scripts/server-rust/security-compatibility.mjs --database postgres --report .qa/rust-server/security-external-http.json
      - name: Synthetic build metadata and existing wire-version rejection
        run: node scripts/server-rust/version-compatibility.mjs
      - name: Worker enrollment, credentials and sockets with native PGlite
        run: node --import tsx scripts/server-rust/worker-compatibility.mjs --report .qa/rust-server/worker-pglite-http.json
      - name: Worker enrollment, credentials and sockets with private PostgreSQL
        run: node --import tsx scripts/server-rust/worker-compatibility.mjs --database bundled-postgres --report .qa/rust-server/worker-bundled-http.json
      - name: Worker control with external PostgreSQL and real authentication lock faults
        run: node --import tsx scripts/server-rust/worker-compatibility.mjs --database postgres --report .qa/rust-server/worker-external-http.json
      - name: Actual Chromium APIs, Live client and unchanged worker components with PGlite
        run: node --import tsx scripts/server-rust/worker-client-compatibility.mjs --report .qa/rust-server/worker-client-pglite.json
      - name: Actual Chromium APIs, Live client and unchanged worker components with private PostgreSQL
        run: node --import tsx scripts/server-rust/worker-client-compatibility.mjs --database bundled-postgres --report .qa/rust-server/worker-client-bundled.json
      - name: Actual Chromium APIs, Live client and unchanged worker components with external PostgreSQL
        run: node --import tsx scripts/server-rust/worker-client-compatibility.mjs --database postgres --report .qa/rust-server/worker-client-external.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-server-${{ matrix.os }}
          path: .qa/rust-server/

name: Computer use native foundation

on:
  pull_request:
    paths:
      - ".github/workflows/computer-use-native.yml"
      - ".github/workflows/native-release.yml"
      - "cantrip_cua/**"
      - "cantrip_worker/src/computer-use/**"
      - "cantrip_worker/src/index.ts"
      - "cantrip_worker/package.json"
      - "cantrip_worker/src/endpoint-content-encryption*.ts"
      - "cantrip_worker/src/interaction-encryption.ts"
      - "cantrip_app/src/lib/endpoint-content-encryption*.ts"
      - "cantrip_app/src/components/chat/agent-interaction-panel*"
      - "cantrip_server/src/app/routes/computer-use*.ts"
      - "cantrip_server/src/app/build-app.ts"
      - "cantrip_server/src/app/runtime/worker-notification-runtime.ts"
      - "cantrip_server/src/db/repository.ts"
      - "cantrip_server/src/db/index.ts"
      - "cantrip_server/src/db/repository/chat-*.ts"
      - "cantrip_server/src/db/repository/settings.ts"
      - "cantrip_server/src/db/repository/projects.ts"
      - "cantrip_server/src/db/repository/computer-use*.ts"
      - "cantrip_server/src/app/routes/agent-interactions.ts"
      - "cantrip_server/src/db/repository/agent-interactions.ts"
      - "cantrip_server/src/db/schema.ts"
      - "cantrip_server/drizzle/**"
      - "cantrip_server/test/computer-use*.test.ts"
      - "packages/protocol/**"
      - "packages/crypto/**"
      - "pnpm-lock.yaml"
      - "scripts/cantrip-cua/**"
      - "scripts/verify-packaged-worker-cua.mjs"
      - "scripts/package-distributions.mjs"
      - "scripts/sign-macos-runtime.mjs"
      - "scripts/verify-macos-distribution.mjs"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: cua-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority-postgres:
    name: CUA committed authority (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cua_fixture
          POSTGRES_PASSWORD: cua_fixture
          POSTGRES_DB: cua_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cua_fixture -d cua_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cantrip/version build
      - run: pnpm --filter @cantrip/logging build
      - run: pnpm --filter @cantrip/protocol build
      - name: Verify post-commit notifications and production lock ordering
        env:
          CANTRIP_CUA_TEST_POSTGRES_URL: postgres://cua_fixture:cua_fixture@127.0.0.1:5432/cua_fixture
        run: pnpm --filter @cantrip/server exec vitest run test/computer-use-authority-postgres.test.ts

  portable-cua:
    name: CUA fake capture (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            target: darwin-arm64
          - runner: blacksmith-4vcpu-windows-2025
            target: win32-x64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cua-${{ matrix.target }}
          workspaces: cantrip_cua -> target
      - run: cargo fmt --manifest-path cantrip_cua/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path cantrip_cua/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path cantrip_cua/Cargo.toml
      - run: node --test scripts/cantrip-cua/*.test.mjs
      - run: node scripts/cantrip-cua/smoke.mjs
      - run: node scripts/cantrip-cua/build.mjs --release
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm cua:test:worker

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cantrip is an open-source, local-first workspace for Codex agents with managed MCP, CodeGraph, editable files, encrypted terminals, persistent VS Code, Git and GitHub, remote surfaces, workflows, and distributed workers."
    />
    <meta name="theme-color" content="#0b0d10" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Cantrip — One workspace for the whole build"
    />
    <meta
      property="og:description"
      content="Managed MCP, CodeGraph, editable files, encrypted terminals, persistent VS Code, Git and GitHub, remote surfaces, and workflows around Codex in one local-first workspace."
    />
    <meta property="og:url" content="https://cantrip.art" />
    <meta property="og:image" content="https://cantrip.art/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Cantrip — One workspace for the whole build"
    />
    <meta
      name="twitter:description"
      content="Managed MCP, CodeGraph, editable files, encrypted terminals, persistent VS Code, Git and GitHub, remote surfaces, and workflows around Codex in one local-first workspace."
    />
    <meta name="twitter:image" content="https://cantrip.art/og.png" />
    <link rel="canonical" href="https://cantrip.art" />
    <link rel="icon" href="/glint.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const stored = localStorage.getItem("cantrip-site-theme");
        const mode =
          stored === "light" || stored === "dark" ? stored : "system";
        const resolved =
          mode === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <title>Cantrip — One workspace for the whole build</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

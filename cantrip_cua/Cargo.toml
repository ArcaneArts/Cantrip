[package]
name = "cantrip-cua"
version = "0.0.0"
description = "Worker-owned Cantrip computer-use runtime"
authors = ["Cantrip"]
edition = "2024"
license = "UNLICENSED"
publish = false

[lib]
name = "cantrip_cua"
path = "src/lib.rs"

[[bin]]
name = "cantrip-cua"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
png = "0.18.0"
font8x8 = "0.3.1"
sha2 = "0.10.9"
crossbeam-channel = "0.5.15"

[profile.release]
strip = "symbols"

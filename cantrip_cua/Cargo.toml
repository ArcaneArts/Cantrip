[package]
name = "cantrip-cua"
version = "0.0.0"
description = "Worker-owned Cantrip computer-use runtime"
authors = ["Cantrip"]
edition = "2024"
license = "UNLICENSED"
publish = false

[lib]
name = "cantrip_cua"
path = "src/lib.rs"

[[bin]]
name = "cantrip-cua"
path = "src/main.rs"

[dependencies]
cantrip-interaction = { path = "../cantrip_interaction", features = ["sprites"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["float_roundtrip"] }
png = "0.18.0"
sha2 = "0.10.9"
crossbeam-channel = "0.5.15"
rquickjs = { version = "=0.12.2", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2.6.0"
futures-lite = "2.6.1"
percent-encoding = "2.3.2"
tempfile = "3.27.0"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
rustix = { version = "1.1.6", features = ["event", "fs", "process"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.13.2", features = ["composite", "image", "randr", "res", "xfixes", "xtest"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSArray", "NSDictionary", "NSError", "NSString", "NSObject"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFString", "CFUUID", "CFRunLoop", "CFCGTypes", "objc2"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEventTypes", "CGImage", "CGDataProvider", "CGColorSpace", "CGDirectDisplay", "CGWindow", "objc2"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCError", "SCScreenshotManager", "SCShareableContent", "SCStream", "objc2-core-media", "dispatch2", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMSync", "objc2-core-video"] }

objc2-metal = "0.3.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CATransaction", "CAMetalLayer", "objc2-metal", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "CVMetalTexture", "CVMetalTextureCache", "objc2-metal", "objc2"] }

[profile.release]
strip = "symbols"

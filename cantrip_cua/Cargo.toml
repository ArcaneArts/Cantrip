[package]
name = "cantrip-cua"
version = "0.0.0"
description = "Worker-owned Cantrip computer-use runtime"
authors = ["Cantrip"]
edition = "2024"
license = "UNLICENSED"
publish = false

[lib]
name = "cantrip_cua"
path = "src/lib.rs"

[[bin]]
name = "cantrip-cua"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
png = "0.18.0"
font8x8 = "0.3.1"
sha2 = "0.10.9"
crossbeam-channel = "0.5.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSObject"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFString", "CFUUID", "CFRunLoop", "CFCGTypes", "objc2"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGColorSpace", "CGDirectDisplay", "CGWindow", "objc2"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCError", "SCScreenshotManager", "SCShareableContent", "SCStream", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics"] }

[profile.release]
strip = "symbols"
